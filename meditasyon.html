<style>

  .nref{font:700 12px system-ui,sans-serif;color:var(--muted);letter-spacing:0;text-transform:none;margin-left:6px}

<script>
"use strict";
// Un thème par jour ; seul le thème du jour s'affiche (date et fuseau horaire du téléphone).
// Versets : Louis Segond 1910 (domaine public). Créole : traduction libre Masbet Education.
var JOU = { ht:['Dimanch','Lendi','Madi','Mèkredi','Jedi','Vandredi','Samdi'], fr:['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'] };
var TEM = [
 { // Dimanche
  c:['#8a5a00','#d9a520'], ico:'🌾',
  ht:{ t:'Richès ak fòtin', r:[
   'Richès pa sèlman kòb ki nan pòch nou. Gen richès ki pi solid : sante, fanmi, zanmi, konesans, non nou pote ak respè. Moun ki gen anpil kòb men ki pèdi lapè ak dignite, li pòv nan sa ki konte plis la.',
   'Sa pa vle di pou nou meprize lajan. Lajan se yon bon sèvitè : li voye timoun lekòl, li bati kay, li pèmèt nou ede lòt moun. Men li se yon move mèt : lè l kòmande nou, li pouse nou mache sou valè nou.',
   'Bib la montre yon chemen : travay ak onètete, ekonomize ti kras pa ti kras, pa kouri dèyè lajan fasil. Richès ki bati sou manti fonn tankou glas nan solèy ; richès ki bati sou travay ak pasyans grandi, tankou pyebwa ki gen bon rasin.'],
   p:'Jodi a, fè lis 5 richès ou genyen ki pa achte ak lajan. Epi chwazi yon ti kantite, menm piti, pou w mete sou kote chak semèn.' },
  fr:{ t:'Richesse et fortune', r:[
   'La richesse n\'est pas seulement l\'argent que l\'on a en poche. Il existe des richesses plus solides : la santé, la famille, les amis, le savoir, un nom que l\'on porte avec honneur. Celui qui possède beaucoup mais a perdu la paix et la dignité est pauvre de ce qui compte le plus.',
   'Il ne s\'agit pas de mépriser l\'argent. L\'argent est un bon serviteur : il envoie les enfants à l\'école, bâtit des maisons, permet d\'aider les autres. Mais c\'est un mauvais maître : quand il commande, il pousse à piétiner ses propres valeurs.',
   'La Bible trace un chemin : travailler avec honnêteté, épargner peu à peu, ne pas courir après l\'argent facile. La richesse bâtie sur le mensonge fond comme la glace au soleil ; celle qui repose sur le travail et la patience grandit, comme un arbre aux bonnes racines.'],
   p:'Aujourd\'hui, écrivez cinq richesses que vous possédez et qui ne s\'achètent pas. Puis choisissez une somme, même petite, à mettre de côté chaque semaine.' },
  v:[['C\'est la bénédiction de l\'Éternel qui enrichit, Et il ne la fait suivre d\'aucun chagrin.','Se benediksyon Letènèl ki fè moun rich, epi li pa mete okenn chagren dèyè l.','Proverbes 10:22'],
     ['La richesse mal acquise diminue, Mais celui qui amasse peu à peu l\'augmente.','Richès ki mal genyen ap diminye, men moun ki ranmase ti kras pa ti kras ap fè l grandi.','Proverbes 13:11'],
     ['Car l\'amour de l\'argent est une racine de tous les maux…','Paske renmen lajan se yon rasin tout kalite mal…','1 Timothée 6:10']],
  s:{o:'Piti piti, zwazo fè nich li.',ht:'',eq:'Petit à petit, l\'oiseau fait son nid.',fr:'Petit à petit, l\'oiseau fait son nid.',ref:'Pwovèb ayisyen / Proverbe haïtien'} },
 { // Lundi
  c:['#173a8c','#5b7cd6'], ico:'🔭',
  ht:{ t:'Vizyon ak revelasyon', r:[
   'Yon vizyon se yon limyè devan nou : li montre ki kote nou vle rive, menm lè chemen an poko klè. San vizyon, nou mache pou nou mache ; jou yo pase, men yo pa mennen okenn kote.',
   'Pwofèt Abakouk te resevwa lòd pou l ekri vizyon an, gwo lèt, pou tout moun ka li l. Vizyon ki rete nan tèt nou sèlman fasil pou bliye. Lè nou ekri l, lè nou pataje l, li vin yon pwomès nou fè ak tèt nou ak lòt moun.',
   'Revelasyon se lè yon bagay ki te kache vin klè : yon solisyon, yon lide, yon vokasyon. Li mande silans, priyè, refleksyon, epi pasyans. Vizyon an gen tan pa l : si l pran tan, tann li ; li pral rive.'],
   p:'Ekri an twa fraz kote ou wè tèt ou nan 5 an. Mete fèy la yon kote ou ka wè l chak maten.' },
  fr:{ t:'Vision et révélation', r:[
   'Une vision est une lumière devant nous : elle montre où nous voulons aller, même quand le chemin n\'est pas encore clair. Sans vision, on marche pour marcher ; les jours passent sans mener nulle part.',
   'Le prophète Habacuc reçoit l\'ordre d\'écrire la vision, en grandes lettres, pour que chacun puisse la lire. Une vision gardée dans la tête s\'oublie vite. Écrite et partagée, elle devient un engagement envers soi-même et envers les autres.',
   'La révélation, c\'est le moment où ce qui était caché devient clair : une solution, une idée, une vocation. Elle demande du silence, de la prière, de la réflexion et de la patience. La vision a son temps : si elle tarde, attends-la ; elle viendra.'],
   p:'Écrivez en trois phrases où vous vous voyez dans cinq ans. Placez la feuille là où vous la verrez chaque matin.' },
  v:[['L\'Éternel m\'adressa la parole, et il dit: Écris la prophétie: Grave-la sur des tables, Afin qu\'on la lise couramment.','Letènèl pale avè m, li di : Ekri vizyon an, grave l byen klè sou tablo yo, pou moun ka li l fasil.','Habacuc 2:2'],
     ['Quand il n\'y a pas de révélation, le peuple est sans frein; Heureux s\'il observe la loi!','Lè pa gen revelasyon, pèp la pa gen fren ; bon chans pou li si l kenbe lalwa !','Proverbes 29:18'],
     ['Invoque-moi, et je te répondrai; Je t\'annoncerai de grandes choses, des choses cachées, Que tu ne connais pas.','Rele m, m ap reponn ou ; m ap fè w konnen gwo bagay ki kache, bagay ou pa konnen.','Jérémie 33:3']],
  s:{o:'En me renversant, on n\'a abattu à Saint-Domingue que le tronc de l\'arbre de la liberté des Noirs ; il repoussera par les racines, parce qu\'elles sont profondes et nombreuses.',ht:'Lè yo fè m tonbe, se sèlman pye bwa libète Nwa yo yo koupe nan Sen Domeng ; l ap repouse pa rasin li, paske yo fon e yo anpil.',fr:'',ref:'Toussaint Louverture, 1802'} },
 { // Mardi
  c:['#9f1239','#e05a7a'], ico:'⚖️',
  ht:{ t:'Aksyon ak vanjans', r:[
   'Lè yo fè nou mal, premye santiman ki leve se anvi rann kou pou kou. Se nòmal pou nou santi kòlè : sa montre nou konnen sa ki jis. Men vanjans pa janm fini : chak kou rele yon lòt kou, epi de fanmi, de katye, de pèp kontinye soufri pandan plizyè jenerasyon.',
   'Bib la pa mande nou rete san fè anyen. Li mande nou chanje kalite aksyon an : kite jistis la nan men Bondye ak nan men lalwa, epi nou menm, goumen kont mal la ak byen. Lafwa san aksyon mouri ; men aksyon ki fèt nan kòlè detwi.',
   'Bon aksyon an se sa ki repare : pale verite a, pote plent kote sa dwe fèt, pwoteje moun ki fèb, refize repete sa yo te fè nou an. Se pi difisil pase vanjans, men se sèl chemen ki bay lapè.'],
   p:'Panse ak yon moun ki fè w mal. Jodi a, olye w panse ak vanjans, chwazi yon aksyon jis : yon konvèsasyon onèt, yon priyè, oswa yon plent kote ki apwopriye.' },
  fr:{ t:'Action et vengeance', r:[
   'Quand on nous fait du mal, le premier mouvement est de rendre coup pour coup. La colère est normale : elle montre que nous savons ce qui est juste. Mais la vengeance ne finit jamais : chaque coup en appelle un autre, et des familles, des quartiers, des peuples souffrent pendant des générations.',
   'La Bible ne demande pas de rester sans rien faire. Elle demande de changer la nature de l\'action : laisser la justice à Dieu et à la loi, et combattre soi-même le mal par le bien. La foi sans les œuvres est morte ; mais l\'action née de la colère détruit.',
   'La bonne action est celle qui répare : dire la vérité, porter plainte là où il faut, protéger les plus faibles, refuser de reproduire ce que l\'on a subi. C\'est plus difficile que la vengeance, mais c\'est le seul chemin vers la paix.'],
   p:'Pensez à quelqu\'un qui vous a fait du mal. Aujourd\'hui, au lieu de la vengeance, choisissez une action juste : une conversation honnête, une prière, ou une démarche auprès de qui de droit.' },
  v:[['Ne vous vengez point vous-mêmes, bien-aimés, mais laissez agir la colère; car il est écrit: A moi la vengeance, à moi la rétribution, dit le Seigneur.','Pa tire revanj pou tèt nou, zanmi m yo ; kite kòlè Bondye a aji, paske men sa ki ekri : Se mwen ki pou tire revanj, se mwen ki pou peye, Senyè a di.','Romains 12:19'],
     ['Ne te laisse pas vaincre par le mal, mais surmonte le mal par le bien.','Pa kite mal la genyen w, men genyen mal la ak byen.','Romains 12:21'],
     ['Il en est ainsi de la foi: si elle n\'a pas les oeuvres, elle est morte en elle-même.','Se konsa lafwa ye tou : si l pa gen zèv, li mouri nan tèt li.','Jacques 2:17']],
  s:{o:'Darkness cannot drive out darkness; only light can do that. Hate cannot drive out hate; only love can do that.',ht:'Fènwa pa ka chase fènwa : se limyè sèlman ki ka fè sa. Rayi pa ka chase rayi : se lanmou sèlman ki ka fè sa.',fr:'Les ténèbres ne peuvent pas chasser les ténèbres : seule la lumière le peut. La haine ne peut pas chasser la haine : seul l\'amour le peut.',ref:'Martin Luther King Jr., « Strength to Love », 1963'} },
 { // Mercredi
  c:['#0f766e','#3fb5a4'], ico:'🌿',
  ht:{ t:'Chans ak gerizon', r:[
   'Nou tout konn wè moun ki travay di san yo pa reyisi, ak lòt ki jwenn chans san yo pa chèche l. Eklezyas rekonèt sa : se pa toujou pi rapid la ki genyen kous la ; tan ak sikonstans jwe yon wòl. Sa ka fè nou dekouraje, men li ka libere nou tou : nou pa kontwole tout bagay.',
   'Sa nou kontwole, se fason nou resevwa sa ki rive nou. Chans se pa sèlman yon bagay ki tonbe sou nou : souvan se yon opòtinite ki jwenn yon moun ki te pare. Prepare w, rete onèt, rete atantif.',
   'Gerizon tou mande tan. Gen blesi nan kò, gen blesi nan kè. Bondye panse blesi moun ki gen kè kase, men li sèvi ak moun pou sa : doktè, enfimyè, zanmi, fanmi. Chèche swen bonè, pale ak yon moun ou fè konfyans : se pa feblès, se kouraj.'],
   p:'Jodi a, pran swen kò w (dlo, repo, yon ti mache) epi kè w : pale ak yon moun sou yon bagay k ap peze w. Si w malad, pa tann : ale wè yon pwofesyonèl sante.' },
  fr:{ t:'Chance et guérison', r:[
   'Nous avons tous vu des gens travailler dur sans réussir, et d\'autres trouver la chance sans la chercher. L\'Ecclésiaste le reconnaît : la course n\'est pas toujours aux plus rapides ; le temps et les circonstances jouent leur rôle. Cela peut décourager, mais aussi libérer : nous ne contrôlons pas tout.',
   'Ce que nous contrôlons, c\'est la manière d\'accueillir ce qui arrive. La chance ne tombe pas seulement du ciel : c\'est souvent une occasion qui rencontre quelqu\'un de préparé. Préparez-vous, restez honnête, restez attentif.',
   'La guérison aussi demande du temps. Il y a des blessures du corps et des blessures du cœur. Dieu panse ceux qui ont le cœur brisé, mais il se sert des autres pour cela : médecins, infirmières, amis, famille. Chercher de l\'aide tôt, parler à quelqu\'un de confiance, ce n\'est pas une faiblesse, c\'est du courage.'],
   p:'Aujourd\'hui, prenez soin de votre corps (eau, repos, un peu de marche) et de votre cœur : parlez à quelqu\'un de ce qui vous pèse. Si vous êtes malade, n\'attendez pas : consultez un professionnel de santé.' },
  v:[['J\'ai encore vu sous le soleil que la course n\'est point aux agiles ni la guerre aux vaillants, ni le pain aux sages, ni la richesse aux intelligents, ni la faveur aux savants; car tout dépend pour eux du temps et des circonstances.','M wè ankò anba solèy la : se pa moun ki kouri vit yo ki toujou genyen kous la, ni vanyan yo ki genyen lagè, ni moun saj yo ki jwenn pen, ni moun entelijan yo ki rich, ni moun save yo ki jwenn favè : tout depann de tan ak sikonstans.','Ecclésiaste 9:11'],
     ['Guéris-moi, Éternel, et je serai guéri; Sauve-moi, et je serai sauvé; Car tu es ma gloire.','Geri m, Letènèl, m ap geri ; sove m, m ap sove ; paske se ou ki fè lwanj mwen.','Jérémie 17:14'],
     ['Il guérit ceux qui ont le coeur brisé, Et il panse leurs blessures.','Li geri moun ki gen kè kase, li panse blesi yo.','Psaumes 147:3']],
  s:{o:'Sa ou pa konnen pi gran pase w.',ht:'',fr:'Ce que tu ne connais pas est plus grand que toi.',ref:'Pwovèb ayisyen / Proverbe haïtien'} },
 { // Jeudi
  c:['#4b2a8f','#8a6ad6'], ico:'📚',
  ht:{ t:'Filozofi ak konesans', r:[
   'Filozofi vle di « renmen sajès ». Se kouraj pou nou poze kesyon : poukisa ? kijan ? èske sa vre ? Moun ki pa janm poze kesyon rete prizonye sa lòt moun di l.',
   'Konesans se yon richès pèsonn pa ka vòlè w. Liv yo, lekòl la, eksperyans granmoun yo, travay chak jou : tout se pòt pou aprann. Men konesans san sajès danjere ; sajès se konnen kijan pou sèvi ak sa nou konnen pou byen tout moun.',
   'Pwovèb yo di kòmansman sajès se krentif Letènèl : yon imilite devan sa ki pi gran pase nou. Moun ki saj vrèman konnen tou sa li pa konnen. Se pou sa li toujou ap aprann.'],
   p:'Jodi a, aprann yon bagay nouvo (yon kesyon Quiz Masbet, yon chapit nan yon liv, yon metye) epi eksplike l bay yon lòt moun.' },
  fr:{ t:'Philosophie et connaissance', r:[
   'Philosophie veut dire « amour de la sagesse ». C\'est le courage de poser des questions : pourquoi ? comment ? est-ce vrai ? Celui qui ne pose jamais de questions reste prisonnier de ce que d\'autres lui disent.',
   'Le savoir est une richesse que personne ne peut vous voler. Les livres, l\'école, l\'expérience des anciens, le travail de chaque jour : autant de portes pour apprendre. Mais le savoir sans sagesse est dangereux ; la sagesse, c\'est savoir utiliser ce que l\'on sait pour le bien de tous.',
   'Les Proverbes disent que le commencement de la science est la crainte de l\'Éternel : une humilité devant ce qui nous dépasse. Le vrai sage sait aussi ce qu\'il ne sait pas. C\'est pourquoi il ne cesse jamais d\'apprendre.'],
   p:'Aujourd\'hui, apprenez une chose nouvelle (une question du Quiz Masbet, un chapitre de livre, un geste de métier) et expliquez-la à quelqu\'un.' },
  v:[['La crainte de l\'Éternel est le commencement de la science; Les insensés méprisent la sagesse et l\'instruction.','Krentif Letènèl se kòmansman konesans ; moun fou yo meprize sajès ak enstriksyon.','Proverbes 1:7'],
     ['Voici le commencement de la sagesse: Acquiers la sagesse, Et avec tout ce que tu possèdes acquiers l\'intelligence.','Men kòmansman sajès : chèche sajès ; ak tout sa ou genyen, chèche konprann.','Proverbes 4:7'],
     ['Si quelqu\'un d\'entre vous manque de sagesse, qu\'il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée.','Si yonn nan nou manke sajès, se pou l mande Bondye, ki bay tout moun san gad dèyè e san repwòch, epi l ap resevwa l.','Jacques 1:5']],
  s:{o:'Lespri pa pran nan bwat.',ht:'',fr:'L\'intelligence ne s\'achète pas en boîte : elle se cultive.',ref:'Pwovèb ayisyen / Proverbe haïtien'} },
 { // Vendredi
  c:['#c2410c','#f08a4b'], ico:'❤️',
  ht:{ t:'Lanmou ak bonte', r:[
   'Lanmou pa sèlman yon santiman, se yon chwa nou fè chak jou. Pòl dekri l byen : li pran pasyans, li bon, li pa jalou, li pa vante tèt li. Se nan ti bagay yo li parèt : yon salitasyon, yon èd, yon pawòl dous lè tout bagay difisil.',
   'Bonte se lanmou ki aji. Mike rezime sa Bondye mande : pratike jistis, renmen mizèrikòd, mache ak imilite. Nan yon peyi kote anpil moun ap soufri, chak ti bonte konte : pataje yon manje, akonpaye yon moun malad, ede yon timoun fè devwa l.',
   'Lanmou kòmanse lakay : fanmi nou, vwazen nou. Li pa mande pou nou dakò sou tout bagay ; li mande respè, pasyans, ak volonte pou nou padone.'],
   p:'Jodi a, fè yon zak bonte san pèsonn pa konnen se ou. Epi di yon moun ou renmen kisa li reprezante pou ou.' },
  fr:{ t:'Amour et bonté', r:[
   'L\'amour n\'est pas seulement un sentiment, c\'est un choix de chaque jour. Paul le décrit bien : il est patient, plein de bonté, sans envie, sans vantardise. Il se voit dans les petites choses : un salut, un coup de main, une parole douce quand tout est difficile.',
   'La bonté, c\'est l\'amour qui agit. Michée résume ce que Dieu demande : pratiquer la justice, aimer la miséricorde, marcher humblement. Dans un pays où beaucoup souffrent, chaque geste compte : partager un repas, accompagner un malade, aider un enfant à faire ses devoirs.',
   'L\'amour commence à la maison : notre famille, nos voisins. Il ne demande pas d\'être d\'accord sur tout ; il demande du respect, de la patience et la volonté de pardonner.'],
   p:'Aujourd\'hui, faites un geste de bonté sans que personne ne sache que c\'est vous. Et dites à quelqu\'un que vous aimez ce qu\'il représente pour vous.' },
  v:[['La charité est patiente, elle est pleine de bonté; la charité n\'est point envieuse; la charité ne se vante point, elle ne s\'enfle point d\'orgueil.','Lanmou pran pasyans, lanmou bon ; lanmou pa jalou, li pa vante tèt li, li pa gonfle ak lògèy.','1 Corinthiens 13:4'],
     ['On t\'a fait connaître, ô homme, ce qui est bien; Et ce que l\'Éternel demande de toi, C\'est que tu pratiques la justice, Que tu aimes la miséricorde, Et que tu marches humblement avec ton Dieu.','Yo fè w konnen, o lòm, sa ki byen ; men sa Letènèl mande w : pratike jistis, renmen mizèrikòd, epi mache ak imilite avèk Bondye w.','Michée 6:8'],
     ['Soyez bons les uns envers les autres, compatissants, vous pardonnant réciproquement, comme Dieu vous a pardonné en Christ.','Se pou nou bon youn ak lòt, gen kè sansib, padone youn lòt, menm jan Bondye padone nou nan Kris la.','Éphésiens 4:32']],
  s:{o:'Men anpil, chay pa lou.',ht:'',eq:'L\'union fait la force.',fr:'Avec beaucoup de mains, le fardeau n\'est pas lourd.',ref:'Pwovèb ayisyen / Proverbe haïtien'} },
 { // Samedi
  c:['#1f4e79','#4a8bc2'], ico:'🕊️',
  ht:{ t:'Saba ak padon', r:[
   'Saba se jou repo. Bondye li menm bay egzanp lan : apre travay, poze. Nan yon vi kote nou toujou ap kouri dèyè lavi, repo pa yon liksi : se yon kòmandman ak yon kado. Kò a bezwen l, lespri a bezwen l, fanmi an bezwen l.',
   'Repo vrèman pa sèlman sispann travay ; se tou depoze chay ki nan kè nou. Pa gen chay ki pi lou pase rankin. Jezi envite tout moun ki fatige ak chaje pou vin jwenn repo.',
   'Padone pa vle di bliye ni di sa ki te fèt la pa grav. Padone se refize kite mal la kontinye kòmande lavi nou. Li ka pran tan ; li ka mande èd. Men chak fwa nou padone, se nou menm ki premye moun ki libere.'],
   p:'Jodi a, pran yon moman repo san telefòn. Epi nan kè w, lage yon rankin : ekri non moun nan sou yon papye, priye pou li, epi chire papye a.' },
  fr:{ t:'Sabbat et pardon', r:[
   'Le sabbat est le jour du repos. Dieu lui-même en donne l\'exemple : après le travail, s\'arrêter. Dans une vie où l\'on court sans cesse, le repos n\'est pas un luxe : c\'est un commandement et un cadeau. Le corps en a besoin, l\'esprit aussi, la famille aussi.',
   'Le vrai repos n\'est pas seulement l\'arrêt du travail ; c\'est aussi déposer les fardeaux du cœur. Aucun n\'est plus lourd que la rancune. Jésus invite tous ceux qui sont fatigués et chargés à venir trouver le repos.',
   'Pardonner ne veut pas dire oublier, ni dire que ce qui s\'est passé n\'était pas grave. Pardonner, c\'est refuser que le mal continue de commander notre vie. Cela peut prendre du temps et demander de l\'aide. Mais chaque fois que l\'on pardonne, c\'est soi-même que l\'on libère d\'abord.'],
   p:'Aujourd\'hui, prenez un moment de repos sans téléphone. Puis, dans votre cœur, déposez une rancune : écrivez le nom de la personne sur un papier, priez pour elle, et déchirez le papier.' },
  v:[['Souviens-toi du jour du repos, pour le sanctifier. Tu travailleras six jours, et tu feras tout ton ouvrage.','Chonje jou repo a pou w mete l apa pou Bondye. W ap travay pandan sis jou, w ap fè tout travay ou.','Exode 20:8-9'],
     ['Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos.','Vini jwenn mwen, nou tout ki bouke ak chaje, m ap ban nou repo.','Matthieu 11:28'],
     ['Supportez-vous les uns les autres, et, si l\'un a sujet de se plaindre de l\'autre, pardonnez-vous réciproquement. De même que Christ vous a pardonné, pardonnez-vous aussi.','Sipòte youn lòt ; si yonn gen rezon pou l plenyen kont lòt, padone youn lòt. Menm jan Kris la padone nou, se pou nou padone tou.','Colossiens 3:13']],
  s:{o:'Dèyè mòn, gen mòn.',ht:'',fr:'Derrière les montagnes, il y a encore des montagnes.',ref:'Pwovèb ayisyen / Proverbe haïtien'} }
];
// 4 réflexions par thème : la 1re ci-dessus (semaine 1), puis 3 autres (semaines 2, 3, 4) ; le cycle recommence toutes les 4 semaines.
var SUITE=[[{"ht":{"r":["Gen moun ki toujou ap di : « Lè m va gen plis, m a kontan. » Men lè plis la rive, yo vle plis ankò. Kontantman se pa gen tout bagay ; se konnen valè sa nou deja genyen.","Apot Pòl te ekri li te aprann viv kontan, kit li te gen anpil, kit li te nan nesesite. Sa pa vle di pou nou sispann travay oswa fè pwojè ; sa vle di pou nou pa kite sa ki manke nou vòlè lajwa sa nou genyen.","Pwovèb yo di moun ki gen men louvri ap jwenn plis toujou. Jenewozite pa fè nou pòv : li fè nou rich nan relasyon, nan respè, nan lapè. Moun ki konn pataje yon pen konnen sa richès vrèman vle di."],"p":"Jodi a, di mèsi pou twa bagay ou genyen, epi bay yon moun yon bagay, menm piti : yon manje, yon ti kòb, tan ou."},"fr":{"r":["Certains répètent : « Quand j'aurai plus, je serai heureux. » Mais quand ce « plus » arrive, ils en veulent encore davantage. Le contentement, ce n'est pas tout avoir ; c'est reconnaître la valeur de ce que l'on a déjà.","L'apôtre Paul écrit qu'il a appris à être content, dans l'abondance comme dans le besoin. Cela ne veut pas dire cesser de travailler ou de faire des projets ; cela veut dire ne pas laisser ce qui nous manque voler la joie de ce que nous avons.","Les Proverbes disent que celui qui donne largement s'enrichit encore. La générosité ne rend pas pauvre : elle enrichit en relations, en respect, en paix. Celui qui sait partager son pain sait ce que richesse veut vraiment dire."],"p":"Aujourd'hui, dites merci pour trois choses que vous avez, et donnez quelque chose à quelqu'un, même peu : un repas, un peu d'argent, votre temps."}},{"ht":{"r":["Fonmi an pa gen chèf, men li ranmase manje l pandan sezon an pou l pa grangou lè move tan rive. Pwovèb yo voye nou gade l pou nou aprann. Prevwa se pa mank lafwa : se bon jesyon.","Dèt ki pa nesesè se yon chay ki lou. Pwovèb yo di moun ki prete lajan vin esklav moun ki prete l la. Anvan nou prete pou yon fèt, yon rad, yon telefòn, mande tèt nou : èske se yon bezwen oswa yon anvi ?","Yon ti kaye ase pou kòmanse : ekri sa k antre ak sa k soti chak semèn. Lè nou wè kote lajan an ale, nou ka chwazi kote nou vle l ale. Yon sòl ak moun nou fè konfyans ka ede tou pou n ranmase pou yon gwo pwojè."],"p":"Pandan sèt jou, ekri tout sa w depanse, menm 10 goud. Nan fen semèn nan, chwazi yon depans ou ka diminye."},"fr":{"r":["La fourmi n'a pas de chef, et pourtant elle amasse sa nourriture pendant la bonne saison pour ne pas avoir faim quand vient le mauvais temps. Les Proverbes nous envoient l'observer pour apprendre. Prévoir n'est pas manquer de foi : c'est bien gérer.","Une dette inutile est un fardeau lourd. Les Proverbes disent que celui qui emprunte devient l'esclave de celui qui prête. Avant d'emprunter pour une fête, un habit ou un téléphone, demandons-nous : est-ce un besoin ou une envie ?","Un petit cahier suffit pour commencer : noter chaque semaine ce qui entre et ce qui sort. Quand on voit où va l'argent, on peut choisir où on veut qu'il aille. Un sòl (tontine) avec des personnes de confiance peut aussi aider à épargner pour un grand projet."],"p":"Pendant sept jours, notez toutes vos dépenses, même 10 gourdes. À la fin de la semaine, choisissez une dépense que vous pouvez réduire."}},{"ht":{"r":["Pwovèb yo di moun ki bon kite yon eritaj pou pitit pitit li. Eritaj sa a se pa sèlman tè ak kay : se yon non respekte, yon metye, yon bon edikasyon, valè yo aprann lakay.","Anpil nan granparan nou pa t gen kòb, men yo te voye pitit yo lekòl ak sa yo te genyen. Se richès sa a ki fè anpil nan nou rive kote nou ye jodi a. Lekòl, liv, metye : se plant ki bay fwi pandan plizyè jenerasyon.","Mande tèt ou : kisa m ap kite dèyè m ? Pa sèlman pou pitit ou, men pou katye ou, pou vil ou. Yon pye bwa ou plante jodi a ap bay lonbraj pou moun ou p ap janm konnen."],"p":"Jodi a, aprann yon jenn moun yon bagay ou konn fè (yon metye, yon kalkil, yon resèt), oswa plante yon pye bwa."},"fr":{"r":["Les Proverbes disent que l'homme de bien laisse un héritage aux enfants de ses enfants. Cet héritage, ce n'est pas seulement la terre et la maison : c'est un nom respecté, un métier, une bonne éducation, des valeurs apprises à la maison.","Beaucoup de nos grands-parents n'avaient pas d'argent, mais ils ont envoyé leurs enfants à l'école avec ce qu'ils avaient. C'est cette richesse qui a permis à beaucoup d'entre nous d'arriver où nous sommes. L'école, les livres, un métier : ce sont des plantes qui donnent des fruits pendant des générations.","Demandez-vous : que vais-je laisser derrière moi ? Pas seulement pour vos enfants, mais pour votre quartier, votre ville. Un arbre planté aujourd'hui donnera de l'ombre à des gens que vous ne connaîtrez jamais."],"p":"Aujourd'hui, apprenez à un jeune quelque chose que vous savez faire (un métier, un calcul, une recette), ou plantez un arbre."}}],[{"ht":{"r":["Lè Neyemi te tande miray Jerizalèm yo te kraze, li te kriye, li te priye, epi li te fè yon plan. Li te mache wè miray yo lannwit, li te konte sa ki bezwen fèt, epi li te mande chak fanmi rebati moso pa l.","Yon vizyon san plan rete yon rèv. Plan an kase gwo objektif la an ti etap : sa m ap fè jodi a, semèn sa a, mwa sa a. Chak ti etap fini ba nou fòs pou pwochen an.","Neyemi pa t travay pou kont li. Yon vizyon ki gwo bezwen anpil men : chèche moun ki ka ede w, epi ede lòt moun ak vizyon pa yo. Ansanm, yo te rebati miray yo nan senkanndesèt jou."],"p":"Chwazi yon objektif ou genyen. Ekri twa ti etap pou rive la, epi fè premye a jodi a."},"fr":{"r":["Quand Néhémie apprend que les murailles de Jérusalem sont en ruine, il pleure, il prie, puis il fait un plan. Il inspecte les murailles de nuit, compte ce qu'il faut faire, et demande à chaque famille de rebâtir sa part.","Une vision sans plan reste un rêve. Le plan découpe le grand objectif en petites étapes : ce que je fais aujourd'hui, cette semaine, ce mois-ci. Chaque petite étape terminée donne de la force pour la suivante.","Néhémie n'a pas travaillé seul. Une grande vision a besoin de beaucoup de mains : cherchez des personnes qui peuvent vous aider, et aidez les autres dans leur vision. Ensemble, ils ont rebâti les murailles en cinquante-deux jours."],"p":"Choisissez un objectif que vous avez. Écrivez trois petites étapes pour y arriver, et faites la première aujourd'hui."}},{"ht":{"r":["Jozèf te fè rèv li ta vin yon moun enpòtan. Men anvan rèv la akonpli, frè l yo te vann li, yo te mete l nan prizon pou yon bagay li pa t fè, epi yo te bliye l la pandan de lane.","Pandan tout tan sa a, Jozèf te kontinye travay byen kote li te ye : lakay Potifa, nan prizon. Li pa t kite move moman yo touye vizyon an. Se konsa, lè lè a rive, li te pare.","Lè vizyon nou pran tan, nou ka panse li pa t vre. Men retadman pa vle di refi. Kontinye prepare w, kontinye aprann, kontinye fè travay ou byen : tan ou ap vini."],"p":"Panse ak yon rèv ou te prèske abandone. Jodi a, fè yon ti bagay pou l rete vivan : yon kesyon, yon lekti, yon kontak."},"fr":{"r":["Joseph a rêvé qu'il deviendrait quelqu'un d'important. Mais avant que ce rêve se réalise, ses frères l'ont vendu, on l'a jeté en prison pour une faute qu'il n'avait pas commise, et on l'y a oublié pendant deux ans.","Pendant tout ce temps, Joseph a continué à bien travailler là où il était : chez Potiphar, en prison. Il n'a pas laissé les mauvais moments tuer la vision. Ainsi, quand le moment est venu, il était prêt.","Quand notre vision tarde, nous pouvons croire qu'elle n'était pas vraie. Mais un retard n'est pas un refus. Continuez à vous préparer, à apprendre, à bien faire votre travail : votre temps viendra."],"p":"Pensez à un rêve que vous avez presque abandonné. Aujourd'hui, faites un petit geste pour le garder vivant : une question, une lecture, un contact."}},{"ht":{"r":["Gen vizyon pou yon moun, gen vizyon pou yon kominote. Kisa nou vle pou vil nou nan dis lane ? Lekòl ki bon, chemen ki pwòp, travay pou jèn yo, espò, kilti, lapè.","Pwovèb la di lè pa gen vizyon, pèp la pa gen fren. Yon kominote ki pa konnen kote l prale ap pran tout direksyon, epi l ap fatige san l pa avanse. Men lè moun yo dakò sou kèk objektif, chak efò vin konte.","Ou pa bezwen se majistra pou w gen vizyon pou vil ou. Yon pwofesè, yon machann, yon atis, yon jèn ki konn enfòmatik : chak moun gen yon kontribisyon. Se tout ti limyè sa yo ansanm ki klere chemen an."],"p":"Ekri yon bagay ou ta renmen wè chanje nan katye w, ak yon ti bagay ou menm ou ka fè pou sa."},"fr":{"r":["Il y a des visions pour une personne, et des visions pour une communauté. Que voulons-nous pour notre ville dans dix ans ? De bonnes écoles, des rues propres, du travail pour les jeunes, du sport, de la culture, la paix.","Le proverbe dit que sans révélation, le peuple est sans frein. Une communauté qui ne sait pas où elle va part dans toutes les directions et s'épuise sans avancer. Mais quand les gens s'accordent sur quelques objectifs, chaque effort compte.","Pas besoin d'être maire pour avoir une vision pour sa ville. Un professeur, une marchande, un artiste, un jeune qui connaît l'informatique : chacun a sa part à apporter. C'est l'ensemble de ces petites lumières qui éclaire le chemin."],"p":"Écrivez une chose que vous aimeriez voir changer dans votre quartier, et un petit geste que vous pouvez faire vous-même pour cela."}}],[{"ht":{"r":["Jak ekri : se pou chak moun prese koute, pa prese pale, pa prese fache. Kòlè ki pale anvan l reflechi di pawòl nou regrèt pita, epi pawòl sa yo kite blesi ki dire lontan.","Kòlè tankou dife : li ka chofe manje, li ka boule kay la. Lè ou santi l ap monte, ba l tan : respire fon, konte jiska dis, mache yon ti moman, tann demen pou w reponn yon mesaj ki fè w fache.","Jodi a, anpil kòlè pase sou telefòn : yon odyo, yon kòmantè, yon pòs. Sa nou ekri nan kòlè rete, li vwayaje, li ka fè dega lwen nou. Anvan ou voye, mande tèt ou : èske sa ap repare oswa sa ap kraze ?"],"p":"Jodi a, chak fwa w santi kòlè monte, tann dis segonn anvan w reponn. Si gen yon mesaj ou te vle voye nan kòlè, efase l."},"fr":{"r":["Jacques écrit : que chacun soit prompt à écouter, lent à parler, lent à se mettre en colère. La colère qui parle avant de réfléchir dit des mots que l'on regrette ensuite, et ces mots laissent des blessures durables.","La colère est comme le feu : elle peut cuire le repas ou brûler la maison. Quand vous la sentez monter, donnez-lui du temps : respirez profondément, comptez jusqu'à dix, marchez un peu, attendez le lendemain pour répondre à un message qui vous a fâché.","Aujourd'hui, beaucoup de colère passe par le téléphone : un audio, un commentaire, une publication. Ce que l'on écrit dans la colère reste, voyage, et peut faire des dégâts loin de nous. Avant d'envoyer, demandez-vous : est-ce que cela répare ou est-ce que cela détruit ?"],"p":"Aujourd'hui, chaque fois que la colère monte, attendez dix secondes avant de répondre. Si vous aviez un message à envoyer sous la colère, effacez-le."}},{"ht":{"r":["Frè Jozèf yo te vann li tankou esklav. Ane pita, se li ki te gen pouvwa, epi yo te vin devan l pou mande manje. Li te ka tire revanj ; okontrè, li te kriye, li te ba yo manje, li te pran swen fanmi yo.","Jozèf te di yo : nou te panse fè m mal, men Bondye te chanje l an byen. Li pa t di sa yo te fè a pa t grav. Li te rekonèt mal la, men li te refize kite l dirije desizyon l.","Vrè fòs la se pa toujou frape pi fò : se gen pouvwa pou w fè mal, epi chwazi pa fè l. Moun ki kontwole tèt li pi fò pase moun ki pran yon vil, Pwovèb yo di."],"p":"Si w gen pouvwa sou yon moun ki te fè w tò (yon travayè, yon frè, yon vwazen), jodi a trete l ak jistis, san vanjans."},"fr":{"r":["Les frères de Joseph l'avaient vendu comme esclave. Des années plus tard, c'est lui qui avait le pouvoir, et ils sont venus devant lui demander à manger. Il aurait pu se venger ; au contraire, il a pleuré, il les a nourris et il a pris soin de leur famille.","Joseph leur a dit : vous aviez pensé me faire du mal, mais Dieu l'a changé en bien. Il n'a pas dit que leur faute n'était pas grave. Il a reconnu le mal, mais il a refusé de le laisser diriger ses décisions.","La vraie force n'est pas toujours de frapper plus fort : c'est d'avoir le pouvoir de faire du mal et de choisir de ne pas le faire. Celui qui se maîtrise vaut mieux que celui qui prend une ville, disent les Proverbes."],"p":"Si vous avez du pouvoir sur quelqu'un qui vous a fait du tort (un employé, un frère, un voisin), traitez-le aujourd'hui avec justice, sans vengeance."}},{"ht":{"r":["Pwofèt Amòs te rele pou jistis koule tankou dlo, tankou yon rivyè ki pa janm sèch. Jistis se pa sèlman pou nou menm lè yo fè nou mal : se pou tout moun, sitou moun ki pa gen vwa.","Vanjans chèche fè yon moun peye. Jistis chèche repare epi anpeche mal la rekòmanse. Se pou sa jistis pase pa règ, pa temwen, pa enstitisyon, menm lè yo lan, menm lè yo pa pafè.","Nou chak ka aji pou jistis : di verite a kòm temwen, refize patisipe nan yon lenchaj oswa nan yon rimè, sipòte yon viktim, mande dwa nou ak lapè. Lè anpil moun fè sa ansanm, sosyete a chanje."],"p":"Jodi a, defann yon moun ki trete mal devan w, oswa refize repete yon rimè ki ka fè yon moun tò."},"fr":{"r":["Le prophète Amos appelait la justice à couler comme de l'eau, comme un torrent qui ne tarit jamais. La justice n'est pas seulement pour nous quand on nous fait du mal : elle est pour tous, surtout pour ceux qui n'ont pas de voix.","La vengeance cherche à faire payer. La justice cherche à réparer et à empêcher que le mal recommence. C'est pourquoi la justice passe par des règles, des témoins, des institutions, même lentes, même imparfaites.","Chacun peut agir pour la justice : dire la vérité comme témoin, refuser de participer à un lynchage ou à une rumeur, soutenir une victime, réclamer ses droits pacifiquement. Quand beaucoup le font ensemble, la société change."],"p":"Aujourd'hui, défendez quelqu'un que l'on traite mal devant vous, ou refusez de répéter une rumeur qui pourrait faire du tort."}}],[{"ht":{"r":["Lè nou santi nou pa gen chans, nou wè sèlman sa ki mal ale. Rekonesans louvri je nou sou sa ki byen ale : yon jou san maladi, yon zanmi ki rele, yon lapli ki tonbe nan bon moman.","Rekonesans pa vle di pou nou fè tankou pwoblèm yo pa egziste. Li vle di pou nou pa kite yo kache rès la. Yon kè ki konn di mèsi pi lejè, li pi fasil pou l jwenn fòs pou l goumen.","Dòmi, manje byen, bwè dlo, ri ak moun nou renmen : se ti bagay ki ede kò a ak lespri a repare. Pran swen tèt ou pa egoyis : se pou w ka la pou lòt moun tou."],"p":"Aswè a, anvan w dòmi, ekri twa bagay ki te byen pase jodi a, menm piti."},"fr":{"r":["Quand on se sent malchanceux, on ne voit que ce qui a mal tourné. La gratitude ouvre les yeux sur ce qui a bien tourné : une journée sans maladie, un ami qui appelle, une pluie tombée au bon moment.","La gratitude ne veut pas dire faire comme si les problèmes n'existaient pas. Elle veut dire ne pas les laisser cacher tout le reste. Un cœur qui sait dire merci est plus léger, et trouve plus facilement la force de se battre.","Dormir, bien manger, boire de l'eau, rire avec ceux qu'on aime : ce sont de petites choses qui aident le corps et l'esprit à se réparer. Prendre soin de soi n'est pas de l'égoïsme : c'est pouvoir être là pour les autres aussi."],"p":"Ce soir, avant de dormir, écrivez trois choses qui se sont bien passées aujourd'hui, même petites."}},{"ht":{"r":["Eklezyas di gen yon tan pou kriye ak yon tan pou ri, yon tan pou fè dèy ak yon tan pou danse. Lè nou pèdi yon moun, yon kay, yon rekòt, nou gen dwa kriye. Lapenn se pri lanmou.","Nan Nip, anpil fanmi konnen doulè tranblemanntè ak siklòn. Gerizon pa vle di bliye : li vle di aprann viv ak sa ki rive a, pote souvni an san l pa kraze nou. Sa pran tan, e chak moun gen ritm pa l.","Pa pote lapenn pou kont ou. Pale ak yon fanmi, yon zanmi, yon pastè, yon pwofesyonèl sante. Epi si w konnen yon moun k ap soufri, pa gen bezwen gwo pawòl : prezans ou deja yon remèd."],"p":"Jodi a, rele oswa vizite yon moun ki te pèdi yon moun oswa yon bagay ane sa a. Koute l plis pase w pale."},"fr":{"r":["L'Ecclésiaste dit qu'il y a un temps pour pleurer et un temps pour rire, un temps pour se lamenter et un temps pour danser. Quand on perd une personne, une maison, une récolte, on a le droit de pleurer. Le chagrin est le prix de l'amour.","Dans les Nippes, beaucoup de familles connaissent la douleur des tremblements de terre et des cyclones. Guérir ne veut pas dire oublier : c'est apprendre à vivre avec ce qui est arrivé, porter le souvenir sans qu'il nous écrase. Cela prend du temps, et chacun a son rythme.","Ne portez pas le chagrin seul. Parlez à un proche, un ami, un pasteur, un professionnel de santé. Et si vous connaissez quelqu'un qui souffre, pas besoin de grands discours : votre présence est déjà un remède."],"p":"Aujourd'hui, appelez ou visitez quelqu'un qui a perdu une personne ou un bien cette année. Écoutez-le plus que vous ne parlez."}},{"ht":{"r":["Pyè te di twa fwa li pa konnen Jezi, nan nwit ki pi difisil la. Li te kriye anpil. Men apre, Jezi te mande l twa fwa : èske ou renmen m ? epi li te konfye l yon gwo misyon. Echèk la pa t dènye mo a.","Nou tout konn echwe : yon egzamen, yon biznis, yon relasyon, yon pwomès. Echèk fè mal, men li pa di kiyès nou ye. Li di sèlman kisa ki pa t mache fwa sa a, epi kisa nou ka aprann.","Dezyèm chans se yon kado nou ka resevwa, epi yon kado nou ka bay. Bay yon moun ki te tonbe yon lòt chans, menm jan ou ta renmen yo ba ou pa w la."],"p":"Panse ak yon echèk ou genyen. Ekri yon leson li ba ou, epi yon premye pa pou w eseye ankò."},"fr":{"r":["Pierre a renié Jésus trois fois, pendant la nuit la plus difficile. Il a pleuré amèrement. Mais ensuite, Jésus lui a demandé trois fois : m'aimes-tu ? et lui a confié une grande mission. L'échec n'a pas eu le dernier mot.","Nous échouons tous un jour : un examen, une affaire, une relation, une promesse. L'échec fait mal, mais il ne dit pas qui nous sommes. Il dit seulement ce qui n'a pas marché cette fois, et ce que nous pouvons apprendre.","Une seconde chance est un cadeau que l'on peut recevoir, et un cadeau que l'on peut offrir. Donnez à quelqu'un qui est tombé une nouvelle chance, comme vous aimeriez qu'on vous donne la vôtre."],"p":"Pensez à un échec que vous avez connu. Écrivez la leçon qu'il vous a donnée, et un premier pas pour essayer de nouveau."}}],[{"ht":{"r":["Yon paj pa jou fè plis pase 300 paj nan yon lane. Lekti se yon vwayaj ki pa koute kòb : li mennen nou nan lòt peyi, nan lòt epòk, nan tèt lòt moun. Chak liv ouvri yon fenèt.","Konesans pa sèlman nan liv. Granmoun nou yo pote yon bibliyotèk nan tèt yo : kont Bouki ak Malis, remèd fèy, istwa fanmi, fason pou plante, pou bati, pou peche. Jan ekriven Amadou Hampâté Bâ te di l, yon granmoun ki mouri se yon bibliyotèk ki boule.","Pwovèb yo mande nou achte sajès, menm si l koute nou tout sa nou genyen. Sa vle di : bay konesans plas li nan lavi nou, menm lè nou okipe. Dis minit pa jou ase pou kòmanse."],"p":"Jodi a, li yon paj nan yon liv (Bibliyotèk Masbet la ka ede w), oswa mande yon granmoun rakonte w yon istwa nan tan lontan."},"fr":{"r":["Une page par jour, c'est plus de 300 pages en un an. La lecture est un voyage qui ne coûte rien : elle nous emmène dans d'autres pays, d'autres époques, dans la tête d'autres personnes. Chaque livre ouvre une fenêtre.","Le savoir n'est pas seulement dans les livres. Nos anciens portent une bibliothèque dans leur tête : les contes de Bouki et Malis, les remèdes de feuilles, l'histoire des familles, la façon de planter, de bâtir, de pêcher. Comme l'a dit l'écrivain Amadou Hampâté Bâ, un vieillard qui meurt, c'est une bibliothèque qui brûle.","Les Proverbes nous demandent d'acquérir la sagesse, même au prix de tout ce que nous possédons. Cela veut dire : donner au savoir sa place dans notre vie, même quand nous sommes occupés. Dix minutes par jour suffisent pour commencer."],"p":"Aujourd'hui, lisez une page d'un livre (la Bibliothèque Masbet peut vous aider), ou demandez à un ancien de vous raconter une histoire d'autrefois."}},{"ht":{"r":["Pwovèb yo di moun ki san eksperyans kwè tout sa yo di l, men moun ki gen bon konprann veye kote l mete pye l. Jodi a, nouvèl vre ak nouvèl manti kouri menm vitès sou telefòn nou.","Anvan nou kwè oswa pataje yon odyo, yon foto, yon « nouvèl ijan », poze twa kesyon : kiyès ki di sa ? kijan li fè konnen ? èske gen lòt sous ki di menm bagay la ? Yon rimè ka detwi repitasyon yon moun nan yon jounen.","Panse pa tèt nou se pa refize tout sa lòt moun di. Se tcheke, konpare, chèche konprann. Se yon fòs ki pwoteje nou ak fanmi nou kont manti, kont eskwokri, kont moun ki vle manipile nou."],"p":"Jodi a, anvan w pataje yon nouvèl, tcheke l nan omwen yon lòt sous serye. Si w pa ka verifye l, pa voye l."},"fr":{"r":["Les Proverbes disent que l'homme simple croit tout ce qu'on lui dit, mais que l'homme prudent fait attention à ses pas. Aujourd'hui, les vraies nouvelles et les mensonges courent à la même vitesse sur nos téléphones.","Avant de croire ou de partager un audio, une photo, une « nouvelle urgente », posons trois questions : qui le dit ? comment le sait-il ? d'autres sources disent-elles la même chose ? Une rumeur peut détruire la réputation de quelqu'un en une journée.","Penser par soi-même, ce n'est pas refuser tout ce que disent les autres. C'est vérifier, comparer, chercher à comprendre. C'est une force qui protège notre famille et nous-mêmes contre le mensonge, l'escroquerie et la manipulation."],"p":"Aujourd'hui, avant de partager une nouvelle, vérifiez-la dans au moins une autre source sérieuse. Si vous ne pouvez pas la vérifier, ne l'envoyez pas."}},{"ht":{"r":["Yo di Sokrat, youn nan pi gwo filozòf yo, te konn di : sèl sa m konnen, se m pa konnen anyen. Se pa t fo modesti : se konsyans li te genyen jan konesans lan gran.","Anpil moun pa poze kesyon paske yo wont : yo pè pou lòt moun pa panse yo pa konnen. Men moun ki poze kesyon wont pou yon minit ; moun ki pa poze l rete san konnen tout lavi l.","Konesans se sèl richès ki grandi lè nou pataje l. Lè w eksplike yon bagay bay yon lòt moun, ou menm ou konprann li pi byen. Yon pwofesè aprann toujou nan men elèv li yo."],"p":"Jodi a, poze yon kesyon ou te toujou wont poze. Epi ede yon moun konprann yon bagay ou konnen."},"fr":{"r":["On rapporte que Socrate, l'un des plus grands philosophes, disait : tout ce que je sais, c'est que je ne sais rien. Ce n'était pas de la fausse modestie : c'était la conscience de l'immensité du savoir.","Beaucoup ne posent pas de questions par honte : ils ont peur que les autres pensent qu'ils ne savent pas. Mais celui qui pose une question a honte une minute ; celui qui ne la pose pas reste ignorant toute sa vie.","Le savoir est la seule richesse qui grandit quand on la partage. Quand vous expliquez quelque chose à quelqu'un, vous le comprenez mieux vous-même. Un professeur apprend toujours de ses élèves."],"p":"Aujourd'hui, posez une question que vous aviez toujours eu honte de poser. Et aidez quelqu'un à comprendre une chose que vous savez."}}],[{"ht":{"r":["Yon nonm t ap vwayaje, bandi bat li, yo kite l mwatye mouri bò chemen an. Yon prèt pase, li vire tèt li. Yon levit pase, li kontinye. Se yon Samariten, yon moun lòt pèp la te meprize, ki te kanpe pou l ede l.","Jezi rakonte istwa sa a pou reponn yon kesyon : kiyès ki pwochen m ? Repons li : pwochen ou se moun ki bezwen w, kèlkeswa katye l, relijyon l, koulè politik li.","Li fasil pou n renmen moun ki sanble ak nou. Lanmou Bib la pi lwen : li travèse lizyè fanmi, katye, gwoup. Se konsa yon kominote divize kòmanse geri."],"p":"Jodi a, ede yon moun ki pa nan gwoup ou, ki pa nan fanmi w, ki pa ka renmèt ou anyen."},"fr":{"r":["Un homme voyageait ; des brigands l'ont battu et laissé à moitié mort au bord du chemin. Un prêtre est passé et a détourné la tête. Un lévite est passé et a continué. C'est un Samaritain, un homme d'un peuple méprisé, qui s'est arrêté pour l'aider.","Jésus raconte cette histoire pour répondre à une question : qui est mon prochain ? Sa réponse : ton prochain, c'est celui qui a besoin de toi, quels que soient son quartier, sa religion, sa couleur politique.","Il est facile d'aimer ceux qui nous ressemblent. L'amour de la Bible va plus loin : il traverse les frontières de la famille, du quartier, du groupe. C'est ainsi qu'une communauté divisée commence à guérir."],"p":"Aujourd'hui, aidez quelqu'un qui n'est pas de votre groupe, pas de votre famille, et qui ne peut rien vous rendre."}},{"ht":{"r":["Pwovèb yo di lanmò ak lavi nan pouvwa lang lan. Yon pawòl ka leve yon moun ki tonbe ; yon lòt pawòl ka kraze yon moun ki t ap kanpe. Nou chak gen pouvwa sa a nan bouch nou chak jou.","Anpil timoun grandi ak pawòl ki di yo yo p ap janm vin anyen. Pawòl sa yo rete nan kè yo pandan lontan. Okontrè, yon pwofesè, yon paran, yon zanmi ki di : « Mwen kwè nan ou », ka chanje yon lavi.","Betiz ak moke ka sanble pa grav, men yo blese. Bonte nan pawòl se pa flate : se di verite a avèk respè, korije san imilye, ankouraje menm lè rezilta a poko la."],"p":"Jodi a, di omwen twa moun yon pawòl ankourajman sensè. Epi evite yon moke, menm pou ri."},"fr":{"r":["Les Proverbes disent que la mort et la vie sont au pouvoir de la langue. Une parole peut relever quelqu'un qui est tombé ; une autre peut briser quelqu'un qui tenait debout. Chacun de nous a ce pouvoir dans la bouche, chaque jour.","Beaucoup d'enfants grandissent avec des paroles qui leur disent qu'ils ne deviendront jamais rien. Ces mots restent longtemps dans leur cœur. À l'inverse, un professeur, un parent, un ami qui dit : « Je crois en toi » peut changer une vie.","Les moqueries peuvent sembler sans gravité, mais elles blessent. La bonté dans les paroles, ce n'est pas flatter : c'est dire la vérité avec respect, corriger sans humilier, encourager même quand le résultat n'est pas encore là."],"p":"Aujourd'hui, adressez une parole d'encouragement sincère à au moins trois personnes. Et évitez une moquerie, même pour rire."}},{"ht":{"r":["Nan tan lontan, konbit te konn rasanble tout katye a pou travay tè yon fanmi, bati yon kay, rekòlte yon jaden. Chak moun te pote fòs li, epi tout moun te manje ansanm apre. Men anpil, chay pa lou.","Pyè ekri lanmou kouvri yon foul peche. Nan yon fanmi, nan yon katye, gen chòk, gen malantandi, gen fot. Lanmou pa fè tankou yo pa la, men li pa kite yo detwi lyen ki ini nou.","Lespri konbit la ka viv ankò jodi a : ede yon vwazen repare kay li, ranmase fatra ansanm, akonpaye granmoun yo, sipòte yon fanmi nan malè. Lè nou fè sa ansanm, nou wè lanmou an."],"p":"Jodi a, òganize oswa patisipe nan yon ti travay ansanm ak vwazen ou (netwaye, repare, ede yon fanmi)."},"fr":{"r":["Autrefois, le konbit rassemblait tout le quartier pour travailler la terre d'une famille, bâtir une maison, récolter un jardin. Chacun apportait sa force, puis tout le monde mangeait ensemble. L'union fait la force.","Pierre écrit que l'amour couvre une multitude de péchés. Dans une famille, dans un quartier, il y a des heurts, des malentendus, des fautes. L'amour ne fait pas comme s'ils n'existaient pas, mais il ne les laisse pas détruire les liens qui nous unissent.","L'esprit du konbit peut revivre aujourd'hui : aider un voisin à réparer sa maison, ramasser les déchets ensemble, accompagner les anciens, soutenir une famille dans le malheur. Quand nous agissons ensemble, l'amour devient visible."],"p":"Aujourd'hui, organisez ou rejoignez un petit travail collectif avec vos voisins (nettoyer, réparer, aider une famille)."}}],[{"ht":{"r":["Levanjil rakonte Jezi te konn leve bonè maten, lè li te fè nwa toujou, pou l al nan yon kote ki trankil pou l priye. Menm lè foul moun t ap chèche l, li te pran tan pou l retire kò l.","Repo lespri a menm jan enpòtan ak repo kò a. Telefòn, radyo, nouvèl, pwoblèm : tèt nou pa janm an silans. San silans, nou pa tande sa kè nou ap di nou, ni sa Bondye ap di nou.","Yon ti mache nan lanati, yon priyè, yon chante, yon moman bò lanmè oswa anba yon pye bwa : se kote lespri a rechaje. Se pa tan pèdi ; se tan ki ba nou fòs pou rès semèn nan."],"p":"Jodi a, pran 15 minit silans san telefòn : priye, mache, oswa gade lanati."},"fr":{"r":["L'Évangile raconte que Jésus se levait tôt le matin, alors qu'il faisait encore nuit, pour aller dans un lieu tranquille et prier. Même quand la foule le cherchait, il prenait le temps de se retirer.","Le repos de l'esprit est aussi important que celui du corps. Téléphone, radio, nouvelles, problèmes : notre tête n'est jamais en silence. Sans silence, nous n'entendons ni ce que notre cœur nous dit, ni ce que Dieu nous dit.","Une marche dans la nature, une prière, un chant, un moment au bord de la mer ou sous un arbre : c'est là que l'esprit se recharge. Ce n'est pas du temps perdu ; c'est du temps qui donne la force pour le reste de la semaine."],"p":"Aujourd'hui, prenez 15 minutes de silence sans téléphone : priez, marchez, ou contemplez la nature."}},{"ht":{"r":["Padone difisil, men mande padon pi difisil ankò. Fò nou rekonèt nou te fè tò, san eskiz, san « men ou menm tou ». Se yon kouraj anpil moun pa genyen.","Zache te yon pèseptè ki te vòlè moun. Lè Jezi rantre lakay li, li te pran desizyon pou l bay pòv yo mwatye byen l, epi renmèt kat fwa sa li te pran nan men moun. Vrè padon mande repare lè sa posib.","Yon « eskize m, mwen te fè tò » sensè ka debloke yon relasyon ki te bloke depi plizyè lane. Pa tann lòt moun nan fè premye pa a : premye pa a ka vin nan men w."],"p":"Jodi a, mande yon moun padon pou yon bagay ou te fè l, epi si w ka, repare tò a."},"fr":{"r":["Pardonner est difficile, mais demander pardon l'est encore plus. Il faut reconnaître sa faute, sans excuse, sans « mais toi aussi ». C'est un courage que beaucoup n'ont pas.","Zachée était un collecteur d'impôts qui volait les gens. Quand Jésus est entré chez lui, il a décidé de donner aux pauvres la moitié de ses biens et de rendre quatre fois ce qu'il avait pris. Le vrai pardon demande de réparer quand c'est possible.","Un « pardonne-moi, j'ai eu tort » sincère peut débloquer une relation bloquée depuis des années. N'attendez pas que l'autre fasse le premier pas : le premier pas peut venir de vous."],"p":"Aujourd'hui, demandez pardon à quelqu'un pour une chose que vous lui avez faite, et si vous le pouvez, réparez le tort."}},{"ht":{"r":["Gen moun ki padone lòt moun fasil, men ki pa janm padone tèt yo. Yo pote yon ansyen erè tankou yon wòch nan kè yo, epi wòch sa a anpeche yo avanse.","Sòm 103 di Bondye mete peche nou lwen nou tankou lès lwen lwès. Si Bondye ka lage l, poukisa nou kenbe l ? Padone tèt nou pa vle di erè a pa t grav ; li vle di nou aksepte aprann, epi kontinye.","Pale ak tèt ou tankou w t ap pale ak yon zanmi ki te fè menm erè a : avèk verite, men avèk bonte. Chak nouvo semèn se yon nouvo paj."],"p":"Ekri yon erè ou toujou reproche tèt ou. Bò kote l, ekri sa ou aprann ladan l. Epi pwomèt tèt ou yon nouvo kòmansman lendi a."},"fr":{"r":["Certains pardonnent facilement aux autres, mais ne se pardonnent jamais à eux-mêmes. Ils portent une vieille erreur comme une pierre dans le cœur, et cette pierre les empêche d'avancer.","Le Psaume 103 dit que Dieu éloigne de nous nos fautes autant que l'orient est éloigné de l'occident. Si Dieu peut les laisser partir, pourquoi les retenir ? Se pardonner ne veut pas dire que l'erreur n'était pas grave ; cela veut dire accepter d'apprendre, et continuer.","Parlez-vous comme vous parleriez à un ami qui aurait fait la même erreur : avec vérité, mais avec bonté. Chaque nouvelle semaine est une nouvelle page."],"p":"Écrivez une erreur que vous vous reprochez encore. À côté, écrivez ce qu'elle vous a appris. Puis promettez-vous un nouveau départ lundi."}}]];
TEM.forEach(function(t,i){ t.x=SUITE[i]||[]; });
/** Numéro de la semaine (du dimanche au samedi), selon la date du téléphone : 0, 1, 2, 3, 0… */
function numSemaine(d){ var jours=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,9,18))/864e5); return ((Math.floor(jours/7)%4)+4)%4; }   // semaine du 18 oct. 2026 = réflexion 1
var LANG='ht';
function lire(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ecrire(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function langue(l){
  LANG=l==='fr'?'fr':'ht'; ecrire('masbet_lang',LANG); document.documentElement.lang=LANG;
  document.getElementById('lHt').classList.toggle('on',LANG==='ht'); document.getElementById('lFr').classList.toggle('on',LANG==='fr');
  afficher();
}
// Sagesse : en français, le proverbe français équivalent quand il existe (eq), sinon la traduction ;
// le texte créole original en petit, et le mot à mot quand il diffère de l'équivalent
function sagesse(w){
  var eq=LANG==='fr'?w.eq:'', tr=eq||w[LANG];
  return '« '+esc(tr||w.o)+' »'+(tr?'<div class="kr">« '+esc(w.o)+' »</div>':'')+
    (eq&&w.fr&&w.fr!==eq?'<div class="mam">'+esc('Mot à mot : « '+w.fr+' »')+'</div>':'')+'<div class="ref">— '+esc(w.ref)+'</div>'; }
function afficher(){
  var d=new Date(), j=d.getDay(), t=TEM[j], k=numSemaine(d), x=t[LANG];   // jour selon le fuseau horaire du téléphone
  if(k>0 && t.x[k-1]){ var y=t.x[k-1][LANG]; x={t:x.t, r:y.r, p:y.p}; }    // réflexion de la semaine (1 à 4)
  document.documentElement.style.setProperty('--c1',t.c[0]); document.documentElement.style.setProperty('--c2',t.c[1]);
  document.querySelector('meta[name=theme-color]').content=t.c[0];
  document.getElementById('jou').textContent=JOU[LANG][j]+' · '+d.toLocaleDateString(LANG==='fr'?'fr-FR':'fr-HT',{day:'numeric',month:'long'});
  document.getElementById('titre').innerHTML='<span class="ico">'+t.ico+'</span>'+esc(x.t);
  document.title=(LANG==='fr'?'Méditation — ':'Meditasyon — ')+x.t;
  var L=LANG==='fr'?{r:'Réflexion',v:'Paroles pour aujourd\'hui',s:'Sagesse',p:'À vivre aujourd\'hui',pied:'Un thème par jour, et 4 réflexions différentes pour chaque thème : elles changent chaque semaine.',src:'Versets : Louis Segond 1910 · créole : traduction libre Masbet Education'}
                   :{r:'Refleksyon',v:'Pawòl pou jodi a',s:'Sajès',p:'Pou viv jodi a',pied:'Yon tèm chak jou, ak 4 refleksyon diferan pou chak tèm : yo chanje chak semèn.',src:'Vèsè yo : Louis Segond 1910 · kreyòl : tradiksyon lib Masbet Education'};
  var vs=t.v.map(function(v){ return '<div class="vese"><div class="t">« '+esc(LANG==='fr'?v[0]:v[1])+' »</div>'+'<div class="ref">'+esc(v[2])+'</div></div>'; }).join('');
  document.getElementById('contenu').innerHTML=
    '<div class="card"><h2>'+L.r+' <span class="nref">'+(k+1)+' / 4</span></h2>'+x.r.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+'</div>'+
    '<div class="card"><h2>'+L.v+'</h2>'+vs+'</div>'+
    '<div class="card sit"><h2>'+L.s+'</h2>'+sagesse(t.s)+'</div>'+
    '<div class="card pratik"><h2>'+L.p+'</h2><p style="margin:0">'+esc(x.p)+'</p></div>'+
    '<div class="pied">'+L.pied+'<br><span style="font-size:11.5px">'+L.src+'</span></div>';
  var n=LANG==='fr'?['Accueil','Acheter','Matchs','Live','Communauté']:['Akèy','Achte','Match','Live','Kominote'];
  document.getElementById('nav').innerHTML='<a href="index.html#akey"><span>🏠</span>'+n[0]+'</a><a href="achte.html"><span>📶</span>'+n[1]+'</a><a href="index.html#match"><span>⚽</span>'+n[2]+'</a><a href="index.html#videyo"><span>🔴</span>'+n[3]+'</a><a href="kominote.html"><span>💬</span>'+n[4]+'</a>';
}
langue(lire('masbet_lang')||'ht');
// À minuit (heure du téléphone), le thème change tout seul
(function(){ var d=new Date(), m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,5)-d; setTimeout(function(){ afficher(); setInterval(afficher,864e5); }, m); })();
