<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="author" content="Duckhens Lespérance — Masbet Education">
<meta name="description" content="Masbet Suite : devis de construction en ligne, prêts à imprimer.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>Masbet Suite — Devis</title>
<style>
  :root{--navy:#14213d;--navy2:#1d2f57;--gold:#fca311;--bg:#f4f5f8;--card:#fff;--ink:#14213d;--muted:#5d6782;--line:#e2e5ee;--ok:#1d8a4e;--err:#c0392b;--acc:#173a8c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  .bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:20}
  .bar .logo{font-weight:900;font-size:18px;letter-spacing:.2px}.bar .logo span{color:var(--gold)}
  .bar .sp{flex:1}
  .bar a,.bar button.l{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:none;border:0;padding:6px 4px}
  .lang{display:flex;border:1.5px solid rgba(255,255,255,.35);border-radius:20px;overflow:hidden}
  .lang button{border:0;background:transparent;color:#cfd6ea;font-weight:800;font-size:12.5px;padding:5px 9px}
  .lang button.on{background:#fff;color:var(--navy)}
  main{max-width:1060px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,33,61,.07)}
  h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}
  .hint{color:var(--muted);font-size:13.5px}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 3px}
  input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  textarea{min-height:64px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--gold);color:var(--navy);cursor:pointer}
  .btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.dark{background:var(--navy);color:#fff}
  .btn.mini{padding:6px 10px;font-size:13px;border-radius:9px}
  .btn.danger{background:#fff;border:1.5px solid #f1c7c2;color:var(--err)}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
  @media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}}
  .msg{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
  .msg.err{background:#fdecea;color:#8e2219}.msg.ok{background:#e8f6ee;color:#155b33}.msg.info{background:#eef2fb;color:#1d3466}
  /* Accueil : fond plan d'architecte */
  .hero{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:28px 20px;margin-bottom:14px;
    background:linear-gradient(135deg,rgba(20,33,61,.96),rgba(23,58,140,.92)),
      repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 22px);
    background-blend-mode:normal}
  .hero:after{content:"";position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;border:2px dashed rgba(252,163,17,.5);border-radius:50%}
  .hero h1{font-size:26px;margin-bottom:8px}.hero h1 span{color:var(--gold)}
  .hero p{margin:0 0 6px;color:#dbe3f6;max-width:560px}
  .feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;max-width:560px}
  .feat div{background:rgba(255,255,255,.1);border-radius:12px;padding:9px 10px;font-size:13.5px}
  .login{max-width:460px}
  /* Liste */
  .dv{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff;cursor:pointer}
  .dv:hover{border-color:var(--gold)}
  .dv .t{font-weight:800}.dv .s{color:var(--muted);font-size:13px}.dv .m{margin-left:auto;font-weight:800;white-space:nowrap}
  .badge{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px}
  .b-br{background:#fff4dc;color:#8a5a00}.b-fi{background:#e8f6ee;color:#1d6b3a}
  .abo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* Éditeur */
  .sec{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:#fbfcfe}
  .sec-h{display:flex;gap:8px;align-items:center}
  .sec-h input{font-weight:800}
  .lg{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:'d d d' 'u q p' 'm m x';gap:6px;border-top:1px dashed var(--line);padding:8px 0}
  .lg>div:nth-child(1){grid-area:d}.lg>div:nth-child(2){grid-area:u}.lg>div:nth-child(3){grid-area:q}.lg>div:nth-child(4){grid-area:p}.lg>.mt{grid-area:m;align-self:center}.lg>.x{grid-area:x;justify-self:end}
  .lg label{margin:0 0 2px;font-size:11.5px}
  .lg .mt{font-weight:800;text-align:right}
  @media(min-width:760px){
    .lg{grid-template-columns:minmax(0,1fr) 90px 80px 120px 150px 34px;grid-template-areas:'d u q p m x';align-items:center;gap:8px}
    .lg-h{display:grid!important;grid-template-columns:minmax(0,1fr) 90px 80px 120px 150px 34px;gap:8px;font-size:12px;font-weight:800;color:var(--muted);padding:6px 0 0}
    .lg label{display:none}
  }
  .lg-h{display:none}
  .x{border:0;background:#fff;border:1.5px solid var(--line);border-radius:9px;width:34px;height:34px;font-weight:900;color:var(--err);cursor:pointer}
  .tot{max-width:420px;margin-left:auto}
  .tot div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
  .tot .g{font-size:18px;font-weight:900;border-bottom:0}
  .lettres{font-style:italic;color:var(--muted);font-size:13.5px;margin-top:6px;text-align:right}
  .stick{position:sticky;bottom:0;background:rgba(244,245,248,.97);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;z-index:10;border-top:1px solid var(--line)}
  @media(max-width:640px){.stick{flex-wrap:nowrap;overflow-x:auto}.stick .btn{padding:9px 11px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}.bar{padding:9px 12px;gap:6px}.bar .logo{font-size:16px;white-space:nowrap}.bar a,.bar button.l{font-size:13px}}
  .logoprev{max-height:70px;max-width:180px;display:block;margin-top:6px}
  .tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tpl{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:#fff;cursor:pointer;font-weight:800;font-size:13px}
  .tpl.on{border-color:var(--gold);background:#fff8ea}
  .tpl i{display:block;height:40px;border-radius:6px;margin-bottom:6px;background:#eef1f7}
  .tpl.t-standard i{background:linear-gradient(#173a8c 0 10px,#eef1f7 10px)}
  .tpl.t-creatif i{background:linear-gradient(90deg,#fca311 0 12px,#eef1f7 12px)}
  .tpl.t-classique i{background:linear-gradient(#eef1f7 0 4px,#14213d 4px 6px,#eef1f7 6px)}
  .couleurs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .couleurs button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
  .couleurs button.on{box-shadow:0 0 0 3px var(--ink)}

  /* Fenêtres : métré, sous-détail */
  .modal{position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px}
  .modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal h2{display:flex;justify-content:space-between;align-items:center}
  .res{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  .res td,.res th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.res td.n,.res th.n{text-align:right;white-space:nowrap}
  .res input{padding:5px 6px;text-align:right}
  .note{background:#eef2fb;border-radius:10px;padding:8px 10px;font-size:13px;color:#1d3466;margin-top:8px}
  .sd{border:0;background:#eef2fb;color:var(--acc);border-radius:8px;font-weight:900;padding:3px 7px;margin-right:6px;cursor:pointer}
  .sdm{border-bottom:1px solid var(--line);padding:8px 0}.sdm1{display:flex;gap:6px}.sdm1 input{flex:1}.sdm2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}.sdm2 label{font-size:12px;margin:0}.sdm2 b{text-align:right;white-space:nowrap;font-size:14px;padding-bottom:10px}
  .tabsdoc .btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  #doc .bpu-d{font-size:11.5px;color:#333;margin-top:2px;white-space:pre-wrap}#doc .bpu-l{font-size:11.5px;font-style:italic;margin-top:3px}
  #doc .sdbloc{break-inside:avoid;page-break-inside:avoid;margin:16px 0 10px;border:1px solid #ccd;border-radius:6px;padding:8px 10px}#doc .sdbloc h3{margin:0 0 4px;font-size:13.5px;color:var(--c)}#doc .sdbloc .sg td{font-weight:800;background:#f6f8fc}#doc .sdbloc .pv td{font-weight:900;background:var(--c);color:#fff}
  .lg .metre{font-size:11.5px;margin-top:2px}.outils{margin:10px 0;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}.outils summary{cursor:pointer;font-weight:800}
  .chk{display:flex;gap:6px;align-items:center;font-weight:600}.chk input{width:auto}
  #verifs{margin:0 auto 12px;max-width:820px;border:1px solid #f0c36d;background:#fff8e6;border-radius:10px;padding:10px 14px;font-size:14px}#verifs.ok{border-color:#9bd3a8;background:#eefaf1}#verifs ul{margin:6px 0 0 18px;padding:0}
  #doc .equiv{font-size:11.5px;color:#444}#doc .faita{margin-top:18px;font-size:12px}
  .prixmat{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;font-size:14px}
  @media(min-width:720px){.prixmat{grid-template-columns:1fr 110px 1fr 110px}}
  /* ===== Document imprimable ===== */
  #doc{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#111;max-width:820px;margin:0 auto;padding:34px 38px;box-shadow:0 2px 14px rgba(0,0,0,.08);font-size:12.5px;line-height:1.4;--c:#173a8c}
  #doc .en{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
  #doc .en img{max-height:78px;max-width:200px}
  #doc .firme{font-size:19px;font-weight:900;color:var(--c)}
  #doc .coord{font-size:11.5px;color:#333}
  #doc .titredoc{font-size:22px;font-weight:900;letter-spacing:1px;color:var(--c);text-align:right}
  #doc .meta{font-size:11.5px;text-align:right}
  #doc .blocs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 10px}
  #doc .bloc{border:1px solid #ccd;border-radius:6px;padding:8px 10px}
  #doc .bloc b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--c);margin-bottom:3px}
  #doc .objet{font-size:13.5px;margin:6px 0 10px}
  #doc table{width:100%;border-collapse:collapse;margin-top:6px}
  #doc th{background:var(--c);color:#fff;font-size:11px;text-align:left;padding:6px}
  #doc td{border-bottom:1px solid #dde;padding:5px 6px;vertical-align:top}
  #doc td.n,#doc th.n{text-align:right;white-space:nowrap}
  #doc tr.lot td{background:#f1f4fa;font-weight:800;color:var(--c)}
  #doc tr.st td{font-weight:800;border-bottom:1.5px solid #bbc}
  #doc .totaux{margin:12px 0 0 auto;width:52%}
  #doc .totaux div{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px solid #dde}
  #doc .totaux .g{background:var(--c);color:#fff;font-weight:900;font-size:14px;border:0}
  #doc .lettres2{margin-top:8px;font-style:italic}
  #doc .cond{margin-top:14px;font-size:11.5px;white-space:pre-wrap}
  #doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:28px}
  #doc .sign div{border-top:1px solid #555;padding-top:6px;font-size:11.5px;min-height:70px}
  #doc .pied{margin-top:18px;font-size:9.5px;color:#777;text-align:center;border-top:1px solid #eee;padding-top:6px}
  /* Modèle Créatif : bande de couleur à gauche, titre en couleur d'accent */
  #doc.creatif{border-left:14px solid var(--c);padding-left:30px}
  #doc.creatif .firme{font-size:22px}
  #doc.creatif th{background:#fff;color:var(--c);border-bottom:2.5px solid var(--c)}
  #doc.creatif .bloc{border:0;background:#f5f7fc;border-radius:10px}
  #doc.creatif .totaux .g{border-radius:8px}
  /* Modèle Classique : noir et blanc, filets fins, sobre */
  #doc.classique{--c:#111;font-family:Georgia,"Times New Roman",serif}
  #doc.classique .en{border-bottom:2px solid #111;padding-bottom:10px}
  #doc.classique th{background:#fff;color:#111;border-top:1.5px solid #111;border-bottom:1.5px solid #111}
  #doc.classique tr.lot td{background:#fff;text-decoration:underline}
  #doc.classique .bloc{border-radius:0}
  #doc.classique .totaux .g{background:#fff;color:#111;border-top:2px solid #111;border-bottom:2px solid #111}
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}
    .bar,.noprint,.stick{display:none!important}
    main{padding:0;max-width:none}
    #doc{box-shadow:none;max-width:none;padding:0}
    #doc.creatif{padding-left:16px}
    #doc tr{page-break-inside:avoid}
  }
  @media(max-width:640px){#doc{padding:18px 14px;font-size:11.5px}#doc .blocs{grid-template-columns:1fr}#doc .totaux{width:100%}#doc .en{flex-direction:column}#doc .titredoc,#doc .meta{text-align:left}}
  @media screen and (max-width:640px){#doc{padding:18px 12px;font-size:11px}#doc td,#doc th{padding:4px 3px}#doc .blocs{grid-template-columns:1fr}#doc .totaux{width:100%}#doc .sdbloc{padding:6px}#doc th.n{white-space:normal}#doc .sdbloc td.n{white-space:normal}#doc .sign{gap:14px}}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">Masbet <span>Suite</span></div>
  <div class="sp"></div>
  <a href="index.html" id="lienApp">← Masbet</a>
  <button class="l hidden" id="btnDeco" onclick="deconnexion()" data-t="deco"></button>
  <div class="lang" role="group" aria-label="Langue / Language"><button id="lFr" onclick="langue('fr')">FR</button><button id="lEn" onclick="langue('en')">EN</button></div>
</div>
<main>
  <!-- ===== Connexion ===== -->
  <section id="vLogin">
    <div class="hero">
      <h1>Masbet <span>Suite</span></h1>
      <p data-t="heroTxt"></p>
      <div class="feat"><div data-t="f1"></div><div data-t="f2"></div><div data-t="f3"></div><div data-t="f4"></div></div>
    </div>
    <div class="card login">
      <h2 data-t="loginTitre"></h2>
      <label for="kod" data-t="kodLabel"></label>
      <input id="kod" autocapitalize="characters" autocomplete="off" placeholder="TK…">
      <div class="row" style="margin-top:10px"><button class="btn" id="btnLogin" onclick="connexion()" data-t="connecter"></button><a class="btn sec" href="achte.html#suite" data-t="acheter"></a></div>
      <div id="mLogin"></div>
      <p class="hint" data-t="loginAide"></p>
    </div>
  </section>

  <!-- ===== Tableau de bord ===== -->
  <section id="vListe" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h1 data-t="mesDevis"></h1>
        <div class="row"><button class="btn sec mini" onclick="ouvrirProfil()" data-t="profil"></button><button class="btn" onclick="nouveauDevis()" id="btnNouveau" data-t="nouveau"></button></div>
      </div>
      <div class="abo" id="abo"></div>
      <div id="mListe"></div>
      <input id="filtre" style="margin-top:10px" oninput="afficherListe()">
      <div id="liste"></div>
    </div>
  </section>

  <!-- ===== Profil (en-tête) ===== -->
  <section id="vProfil" class="hidden">
    <div class="card">
      <h1 data-t="profilTitre"></h1>
      <p class="hint" data-t="profilAide"></p>
      <div class="grid2">
        <div><label for="pFirme" data-t="pFirme"></label><input id="pFirme" maxlength="120"></div>
        <div><label for="pIng" data-t="pIng"></label><input id="pIng" maxlength="120"></div>
        <div><label for="pTitre" data-t="pTitre"></label><input id="pTitre" maxlength="120"></div>
        <div><label for="pNif" data-t="pNif"></label><input id="pNif" maxlength="40"></div>
        <div><label for="pAdresse" data-t="pAdresse"></label><input id="pAdresse" maxlength="200"></div>
        <div><label for="pTel" data-t="pTel"></label><input id="pTel" maxlength="80"></div>
        <div><label for="pEmail" data-t="pEmail"></label><input id="pEmail" maxlength="120" type="email"></div>
        <div><label for="pWeb" data-t="pWeb"></label><input id="pWeb" maxlength="120"></div>
      </div>
      <label for="pLogo" data-t="pLogo"></label><input id="pLogo" type="file" accept="image/png,image/jpeg,image/webp" onchange="chargerLogo(this)">
      <img id="pLogoPrev" class="logoprev hidden" alt=""><button class="btn danger mini hidden" id="pLogoX" onclick="retirerLogo()" style="margin-top:6px" data-t="retirerLogo"></button>
      <label data-t="pModele"></label>
      <div class="tpls" id="tpls"></div>
      <label data-t="pCouleur"></label>
      <div class="couleurs" id="couleurs"></div>
      <div class="grid2">
        <div><label for="pDevise" data-t="pDevise"></label><select id="pDevise"><option>HTG</option><option>USD</option></select></div>
        <div><label for="pTca" data-t="pTca"></label><input id="pTca" type="number" min="0" max="30" step="0.5"></div>
      </div>
      <label data-t="pPrix"></label><p class="hint" style="margin:0 0 6px" data-t="pPrixAide"></p>
      <div class="grid2"><div><label for="pPrixDev" data-t="pPrixDev"></label><select id="pPrixDev"><option>HTG</option><option>USD</option></select></div>
        <div><label for="pTaux" data-t="pTaux"></label><input id="pTaux" type="number" min="0" step="any" placeholder="ex. 132"></div></div>
      <p class="hint" id="pPrixMaj" style="margin:0 0 6px"></p>
      <div class="prixmat" id="prixmat"></div>
      <div class="grid2"><div><label for="pSac" data-t="pSac"></label><select id="pSac"><option value="42.5">42,5 kg</option><option value="50">50 kg</option></select></div><div class="hint" style="align-self:end;padding-bottom:12px" data-t="pSacAide"></div></div>
      <label data-t="pCoefs"></label>
      <div class="grid2" style="grid-template-columns:1fr 1fr 1fr 1fr">
        <div><label for="pKIm" data-t="sdIm"></label><input id="pKIm" type="number" min="0" step="any"></div><div><label for="pKTx" data-t="sdTx"></label><input id="pKTx" type="number" min="0" step="any"></div>
        <div><label for="pKFg" data-t="sdFg"></label><input id="pKFg" type="number" min="0" step="any"></div><div><label for="pKPr" data-t="sdPr"></label><input id="pKPr" type="number" min="0" step="any"></div>
      </div>
      <label for="pCond" data-t="pCond"></label><textarea id="pCond" maxlength="1500"></textarea>
      <div id="mProfil"></div>
      <div class="row" style="margin-top:12px"><button class="btn" onclick="enregistrerProfil()" data-t="enregistrer"></button><button class="btn sec" onclick="vue('liste')" data-t="retour"></button></div>
    </div>
  </section>

  <!-- ===== Éditeur ===== -->
  <section id="vEditeur" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h1 id="edTitre"></h1><span id="edStatut"></span></div>
      <div class="grid2">

function lettresFr(n){

  var D={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante'};
  function m100(x){ // 0..99
    if(x<17) return U[x];
    if(x<20) return 'dix-'+U[x-10];
    var d=Math.floor(x/10), u=x%10;
    if(d===7||d===9){ var base=d===7?'soixante':'quatre-vingt'; var r=x-(d===7?60:80); return base+(r===11&&d===7?' et onze':'-'+m100(r)); }

    return D[d]+(u===0?'':u===1?' et un':'-'+U[u]);
  }
  function m1000(x, finale){ // 0..999 ; finale : le groupe est en fin de nombre (accord de cent/vingt)
    var c=Math.floor(x/100), r=x%100, s='';
    if(c>0) s=(c>1?U[c]+' ':'')+'cent'+(c>1&&r===0&&finale?'s':'');

    return s;
  }
  n=Math.floor(Math.abs(n)); if(n===0) return 'zéro';
  var mds=Math.floor(n/1e9), mns=Math.floor(n/1e6)%1000, mil=Math.floor(n/1000)%1000, r=n%1000, out=[];
  if(mds) out.push(m1000(mds,true)+' milliard'+(mds>1?'s':''));
  if(mns) out.push(m1000(mns,true)+' million'+(mns>1?'s':''));
  if(mil) out.push(mil===1?'mille':m1000(mil,false)+' mille');
  if(r) out.push(m1000(r,true));

}

  function m1000(x){ var c=Math.floor(x/100), r=x%100, s=c?U[c]+' hundred':''; if(r){ var t=r<20?U[r]:D[Math.floor(r/10)]+(r%10?'-'+U[r%10]:''); s+=(s?' and ':'')+t; } return s; }
  n=Math.floor(Math.abs(n)); if(n===0) return 'zero';
  var parts=[], g=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];
  g.forEach(function(x){ var q=Math.floor(n/x[0])%1000; if(q) parts.push(m1000(q)+' '+x[1]); });
  if(n%1000) parts.push((parts.length && n%1000<100?'and ':'')+m1000(n%1000));
  return parts.join(' ');
}
// Montant entier en lettres avec la monnaie : la gourde est féminine (« vingt et une gourdes », « une gourde »)
function montantFr(ent,dev){
  var t=lettresFr(ent), usd=dev==='USD';
  if(!usd) t=t.replace(/(^|[ -])un$/,'$1une');
  var nom=usd?(ent<2?'dollar américain':'dollars américains'):(ent<2?'gourde':'gourdes');
  return t+((/(million|milliard)s?$/.test(t))?' de ':' ')+nom;
}
function enLettres(montant){
  var dev=(DEVIS&&DEVIS.devise)||'HTG', ent=Math.floor(arrondi(montant)), cts=Math.round((arrondi(montant)-ent)*100);
  if(LANG==='en'){ var nomE=dev==='USD'?(ent===1?'US dollar':'US dollars'):(ent===1?'gourde':'gourdes'); var e=lettresEn(ent); return e.charAt(0).toUpperCase()+e.slice(1)+' '+nomE+(cts?' and '+lettresEn(cts)+(dev==='USD'?' cents':' centimes'):''); }
  var t=montantFr(ent,dev); t=t.charAt(0).toUpperCase()+t.slice(1);
  return t+(cts?' et '+lettresFr(cts)+(dev==='USD'?' cent'+(cts>1?'s':''):' centime'+(cts>1?'s':'')):'');
}

// ---------- Réseau ----------
function appelGet(action, params){
  if(DEMO) return demo(action, params);
  var q='api='+encodeURIComponent(action); Object.keys(params||{}).forEach(function(k){ q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]); });
  return lireReponse(fetch(API+'?'+q+'&_='+Date.now(),{credentials:'omit',cache:'no-store',redirect:'follow'}));
}
function appelPost(action, corps){
  if(DEMO) return demo(action, corps);
  var c=Object.assign({api:action}, corps||{});
  // text/plain : requête « simple », sans pré-vérification CORS (Apps Script la refuse)
  return lireReponse(fetch(API,{method:'POST',credentials:'omit',cache:'no-store',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(c)}));
}
function lireReponse(p){

    var c=document.createElement('canvas'); c.width=w; c.height=h; var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);

function pourChaquePrix(fn){ // applique fn(prix) à tous les prix du devis (lignes et sous-détails)
  DEVIS.lots.forEach(function(l){ l.lignes.forEach(function(g){
    if(g.sd && g.sd.g){ GROUPES.forEach(function(gr){ (g.sd.g[gr]||[]).forEach(function(m){ m.p=arrondi(fn(nombre(m.p))); }); }); var t=sdTotaux(g.sd); if(t.base>0) g.pu=t.pu; else g.pu=arrondi(fn(nombre(g.pu))); }
    else g.pu=arrondi(fn(nombre(g.pu)));
  }); });
}
// Conversion sans dérive : chaque prix garde sa valeur d'origine ; un aller-retour HTG → USD → HTG redonne exactement les mêmes prix
function convPrix(o,cle,de,vers,t){
  var x=nombre(o[cle]), m=o._m||(o._m={});
  if(m[cle] && m[cle].d===vers && m[cle].c===x){ o[cle]=m[cle].o; delete m[cle]; return; }
  var y=arrondi(de==='USD'?x*t:x/t); m[cle]={d:de,o:x,c:y}; o[cle]=y;
}
function convertirPrix(de,vers,t){
  DEVIS.lots.forEach(function(l){ l.lignes.forEach(function(g){
    if(g.sd && g.sd.g){ GROUPES.forEach(function(gr){ (g.sd.g[gr]||[]).forEach(function(m){ convPrix(m,'p',de,vers,t); }); }); }
    convPrix(g,'pu',de,vers,t);

}

function totaux(d){
  var lots=d.lots.map(function(l){ var st=0; l.lignes.forEach(function(g){ st+=arrondi(nombre(g.q)*nombre(g.pu)); }); return arrondi(st); });
  var ht=arrondi(lots.reduce(function(a,b){return a+b;},0));
  var imp=arrondi(ht*nombre(d.imprevus)/100), rem=Math.min(arrondi(nombre(d.remise)), ht+imp), base=arrondi(ht+imp-rem), tca=arrondi(base*nombre(d.tca)/100);
  return { lots:lots, ht:ht, imp:imp, rem:rem, base:base, tca:tca, ttc:arrondi(base+tca) };
}

function sdNormal(o,g){

  else if(g.mat && g.mat.length){ n.g.mat=g.mat.map(function(m){ return {d:nomMat(m.k),u:MAT[m.k]?MAT[m.k].u:'u',q:m.q,p:prixMat(m.k),k:m.k}; }); n.base=nombre(g.q)||1; }

function sdTotaux(sd){
  var st={}; GROUPES.forEach(function(gr){ st[gr]=0; (sd.g[gr]||[]).forEach(function(m){ st[gr]+=arrondi(nombre(m.q)*nombre(m.p)); }); });

}

  if(LANG==='en') return pre+': '+lettresEn(ent)+' '+(dev==='USD'?(ent===1?'US dollar':'US dollars'):(ent===1?'gourde':'gourdes'))+' and '+c+'/100';
  return pre+DP+montantFr(ent,dev)+' et '+c+'/100';
}
function sansPct(k){ return T(k).replace(/ \(%\)$/,''); }

function lignesDevis(d){ var l=[], nl=0; d.lots.forEach(function(lot,i){ var v=lot.lignes.filter(ligneVisible); if(!v.length) return; nl++; v.forEach(function(g,j){ l.push({n:nl+'.'+(j+1),g:g,lot:lot,i:i,nl:nl}); }); }); return l; }

  });
  return h+'</tbody></table>'+(deux?'<p class="equiv">'+esc(T('tauxUtilise')(fq(tauxDe(d.taux),2)))+'</p>':'');
}
function docSd(d){
  var l=lignesDevis(d).filter(function(x){ return x.g.sd; }); if(!l.length) return '<p>'+esc(T('docSdVide'))+'</p>';

    var dv=' ('+(d.devise||'HTG')+')'; h+='<table><thead><tr><th>'+esc(T('designation'))+'</th><th class="n">'+esc(T('mQte'))+'</th><th>'+esc(T('unite'))+'</th><th class="n">'+esc(T('docCu')+dv)+'</th><th class="n">'+esc(T('docCt')+dv)+'</th></tr></thead><tbody>';
    GROUPES.forEach(function(gr,n){
      h+='<tr class="lot"><td colspan="5">'+(n+1)+'. '+esc(T('sdG_'+gr))+'</td></tr>';
      sd.g[gr].forEach(function(m){ h+='<tr><td>'+esc(m.d)+'</td><td class="n">'+esc(fq(m.q))+'</td><td>'+esc(m.u)+'</td><td class="n">'+esc(nb(m.p))+'</td><td class="n">'+esc(nb(nombre(m.q)*nombre(m.p)))+'</td></tr>'; });
      if(gr==='tr' && t.st.trp) h+='<tr><td colspan="4">'+esc(T('sdTrp'))+' ('+esc(fq(sd.trp))+' %)</td><td class="n">'+esc(nb(t.st.trp))+'</td></tr>';
      h+='<tr class="sg"><td colspan="4">'+esc(T('sousTotal'))+' ('+(n+1)+')</td><td class="n">'+esc(nb(t.st[gr]))+'</td></tr>';
    });
    [[T('sdCs')+' (1+2+3+4)',t.cs,'sg'],[sansPct('sdIm')+' ('+fq(sd.im)+' %)',t.im],[sansPct('sdTx')+' ('+fq(sd.tx)+' %)',t.tx],[sansPct('sdFg')+' ('+fq(sd.fg)+' %)',t.fg],[sansPct('sdPr')+' ('+fq(sd.pr)+' %)',t.pr],[T('sdPv'),t.pv,'sg'],[T('sdPU')+' ('+x.g.u+')',t.pu,'pv']]
      .forEach(function(r){ h+='<tr'+(r[2]?' class="'+r[2]+'"':'')+'><td colspan="4">'+esc(r[0])+'</td><td class="n">'+esc(nb(r[1]))+'</td></tr>'; });
    return h+'</tbody></table></div>';
  }).join('');
}
