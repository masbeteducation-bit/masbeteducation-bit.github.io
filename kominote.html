var FOTO='';
function imgFoto(u,cls,load){ var alt=u.replace('https://lh3.googleusercontent.com/d/','https://drive.google.com/thumbnail?id=').replace(/=w1000$/,'&sz=w1000');
  return '<img class="'+cls+'" loading="'+load+'" referrerpolicy="no-referrer" alt="" src="'+esc(u)+'"'+(alt!==u?' onerror="if(!this.dataset.r){this.dataset.r=1;this.src=\''+esc(alt)+'\';}"':'')+'>'; }
function fotoZone(){
  el('fotoZ').innerHTML=FOTO?'<div class="fotoP"><img src="'+FOTO+'" alt=""><button type="button" onclick="FOTO=\'\';fotoZone()">'+esc(T('fotoRetire'))+'</button></div><div class="fotoInfo">'+esc(T('fotoInfo'))+'</div>'
    :'<label class="fotoB" for="nFoto">'+esc(T('foto'))+'</label><input type="file" id="nFoto" accept="image/*" class="hidden" onchange="fotoChwazi(this)">';
}
function fotoChwazi(inp){
  var f=inp.files&&inp.files[0]; if(!f) return; msg('mNouvo','');
  var url=URL.createObjectURL(f), im=new Image();
  im.onload=function(){
    try{
      var max=1080, w=im.naturalWidth, h=im.naturalHeight, k=Math.min(1,max/Math.max(w,h)), c=document.createElement('canvas');
      c.width=Math.round(w*k); c.height=Math.round(h*k); var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      var q=0.78, d=c.toDataURL('image/jpeg',q); while(d.length>330000&&q>0.4){ q-=0.08; d=c.toDataURL('image/jpeg',q); }
      URL.revokeObjectURL(url); FOTO=d; fotoZone();
    }catch(e){ URL.revokeObjectURL(url); msg('mNouvo',esc(T('fotoLi'))); }
  };
  im.onerror=function(){ URL.revokeObjectURL(url); msg('mNouvo',esc(T('fotoLi'))); fotoZone(); };
  im.src=url;
}

var KL=null, KLT=null;
/** « Mari », « Mari ak 2 lòt moun », « 3 moun » / « Mari a », « Mari et 2 autres ont », « 3 personnes ont » (q = '' si pas de compte). */
function kiMoun(q,n,lg){
  if(lg==='fr') return q?(n>1?q+' et '+(n-1)+' autre'+(n>2?'s':'')+' ont':q+' a'):(n>1?n+' personnes ont':'Quelqu\'un a');
  return q?(n>1?q+' ak '+(n-1)+' lòt moun':q):(n>1?n+' moun':'Yon moun');
}
function klochVu(){ return Number(lire('masbet_kom_vu')||0); }
function klochChaje(){
  if(document.hidden) return;
  get('kom_notif',{appareil:appareil()}).then(function(d){ KL=d; if(d.ev.length) ecrire('masbet_kom_moi','1'); klochBadj(); if(!el('vNotif').classList.contains('hidden')) klochLis(); }).catch(function(){});
}
function klochBadj(){ var vu=klochVu(), n=KL?KL.ev.filter(function(x){ return x.d>vu; }).length:0, b=el('klochN');
  b.textContent=n>99?'99+':String(n); b.classList.toggle('hidden',!n); }
function klochGwoupe(ev,vu){   // les j'aime d'un même sujet / commentaire sont regroupés
  var g={}, out=[];
  ev.forEach(function(x){
    if(x.t==='like'||x.t==='likek'){ var k=x.t+x.cible; if(!g[k]){ g[k]={t:x.t,sije:x.sije,titre:x.titre,d:x.d,qui:[],n:0,nv:false}; out.push(g[k]); }
      g[k].n++; if(x.qui&&g[k].qui.indexOf(x.qui)<0) g[k].qui.push(x.qui); if(x.d>vu) g[k].nv=true; if(x.d>g[k].d) g[k].d=x.d; }
    else out.push({t:x.t,sije:x.sije,titre:x.titre,d:x.d,qui:[x.qui],texte:x.texte,n:1,nv:x.d>vu});
  });
  return out.sort(function(a,b){ return b.d-a.d; });
}
function klochLis(){
  var vu=Number(el('klochL').getAttribute('data-vu')||klochVu()), l=KL?klochGwoupe(KL.ev,vu):null;

  el('klochL').innerHTML=l.length?l.map(function(x){
    var q=x.qui[0]||'', ti=x.titre||'…', qk=q||T('yonMoun'), ic=x.t==='like'||x.t==='likek'?'❤️':x.t==='rep'?'↩️':'💬';

    :'<p class="hint">'+esc(T('klochVid'))+'</p>';
}

function rechaje(){ if(!SIJE||document.hidden) return; get('kom_sije',{id:SIJE.sujet.id,appareil:appareil()}).then(function(d){ SIJE=d; Object.keys(LK).forEach(function(id){ var e=LK[id]; if(e.attente) objetsLike(id).forEach(function(o){ if(o.jaime!==e.voulu){ o.jaime=e.voulu; o.likes=Math.max(0,(o.likes||0)+(e.voulu?1:-1)); } }); }); afficherSije(); }).catch(function(){}); }
// Cœur vide (contour) tant qu'on n'a pas aimé ; cœur rouge plein après le « j'aime »
function coeur(plein){ return '<svg class="coeur" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 20.6l-1.2-1.1C6.2 15.4 3.2 12.7 3.2 9.3 3.2 6.6 5.3 4.5 8 4.5c1.5 0 3 .7 4 1.9 1-1.2 2.5-1.9 4-1.9 2.7 0 4.8 2.1 4.8 4.8 0 3.4-3 6.1-7.6 10.2L12 20.6z" fill="'+(plein?'#e11d48':'none')+'" stroke="'+(plein?'#e11d48':'#8a93a8')+'" stroke-width="1.9" stroke-linejoin="round"/></svg>'; }
function boutonLike(o){ return '<button class="act'+(o.jaime?' on':'')+'" data-lk="'+esc(o.id)+'" aria-pressed="'+(o.jaime?'true':'false')+'" onclick="like(\''+esc(o.id)+'\')">'+coeur(o.jaime)+' '+o.likes+'</button>'; }
function afficherSije(){
  var s=SIJE.sujet;
  el('post').classList.toggle('img',!!s.foto);
  el('post').innerHTML=(s.foto?imgFoto(s.foto,'kf','eager'):'')+'<div class="c">'+(s.fotoAtann?'<div class="atann">'+esc(T('fotoAtann'))+'</div>':s.fotoRefize?'<div class="atann">'+esc(T('fotoRefize'))+'</div>':'')+'<div class="meta" style="margin:0">'+avatar(s.pseudo)+'<b style="color:var(--ink)">'+esc(s.pseudo)+(s.moi?' '+esc(T('ou')):'')+'</b><span>· '+esc(depi(s.date))+'</span></div>'+
    '<div class="t">'+esc(s.titre)+'</div><div class="txt">'+esc(s.texte)+'</div><div class="acts">'+boutonLike(s)+'<button class="act pat" onclick="patajeSije()"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="vertical-align:-3px"><path fill="currentColor" d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 8.8C7.5 8.3 6.8 8 6 8c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg> '+esc(T('pataje'))+'</button>'+(s.moi?'':'<button class="act disc" onclick="siyale(\''+esc(s.id)+'\')">⚑ '+esc(T('siyale'))+'</button>')+'</div></div>';
  var ks=SIJE.commentaires, rasin=ks.filter(function(k){ return !k.parent || !ks.some(function(x){ return x.id===k.parent; }); });
  if(SIJE._partiel){ el('nbKom').textContent='💬 '+(s.nb||0)+' '+((s.nb||0)>1?T('komN'):T('kom1')); el('koms').innerHTML='<div class="chaj"><i></i>'+esc(T('chajKom'))+'</div>'; return; }
  el('nbKom').textContent=ks.length+' '+(ks.length>1?T('komN'):T('kom1'));
  var un=function(k,rep){ return '<div class="kom'+(rep?' rep':'')+'"><div class="h">'+avatar(k.pseudo)+'<b>'+esc(k.pseudo)+(k.moi?' '+esc(T('ou')):'')+'</b><span class="hint">· '+esc(depi(k.date))+'</span></div>'+
    '<div class="txt" style="margin:4px 0 0 34px">'+esc(k.texte)+'</div><div class="acts" style="margin-left:30px">'+boutonLike(k)+
    '<button class="act disc" onclick="repon(\''+esc(rep?k.parent:k.id)+'\',\''+esc(k.pseudo).replace(/'/g,'')+'\')">↩ '+esc(T('repon'))+'</button>'+(k.moi?'':'<button class="act disc" onclick="siyale(\''+esc(k.id)+'\')">⚑</button>')+'</div></div>'; };
  el('koms').innerHTML = ks.length ? rasin.map(function(k){ return un(k,false)+ks.filter(function(x){ return x.parent===k.id; }).map(function(x){ return un(x,true); }).join(''); }).join('') : '<p class="hint">'+esc(T('okennKom'))+'</p>';
}
function repon(id,p){ PARENT=id; el('repa').innerHTML=esc(T('repaA')(p))+'<a href="#" onclick="PARENT=\'\';el(\'repa\').innerHTML=\'\';return false">'+esc(T('anileRep'))+'</a>'; el('kTeks').focus(); el('zKomante').scrollIntoView({behavior:'smooth',block:'center'}); }
function komante(){
  var ps=pseudoDe('ps2'), b=el('bKom'); b.disabled=true; b.textContent=T('apVoye');
  post('kom_komante',{appareil:appareil(),pseudo:ps,sije:SIJE.sujet.id,parent:PARENT,texte:el('kTeks').value}).then(function(d){
    ecrire('masbet_pseudo',ps); ecrire('masbet_kom_moi','1'); el('kTeks').value=''; PARENT=''; el('repa').innerHTML=''; zonesPseudo(); msg('mKom','');
    if(d&&d.commentaire&&SIJE&&!SIJE._partiel){ SIJE.commentaires.push(d.commentaire); SIJE.sujet.nb=(SIJE.sujet.nb||0)+1; afficherSije(); } else return rechaje();
  }).catch(function(e){ msg('mKom',esc(e.message)); }).then(function(){ b.disabled=false; b.textContent=T('voye'); });
}
// v42.3 : « j'aime » instantané — le cœur change tout de suite ; Google est mis à jour derrière.
// Plusieurs touchers rapides : on n'envoie que ce qu'il faut pour arriver à l'état voulu.
var LK={};
function objetsLike(id){ var o=[]; if(SIJE){ if(SIJE.sujet.id===id) o.push(SIJE.sujet); SIJE.commentaires.forEach(function(k){ if(k.id===id) o.push(k); }); } LIS.forEach(function(s){ if(s.id===id) o.push(s); }); return o; }
function poserLike(id,jaime,likes){ objetsLike(id).forEach(function(o){ o.jaime=jaime; o.likes=Math.max(0,likes); }); if(SIJE) afficherSije(); }
function like(id){
  var o=objetsLike(id)[0]; if(!o) return;
  var e=LK[id]||(LK[id]={conf:{jaime:!!o.jaime,likes:o.likes||0},attente:false});
  e.voulu=!o.jaime; poserLike(id,e.voulu,(o.likes||0)+(e.voulu?1:-1));
  var b=document.querySelector('[data-lk="'+id+'"]'); if(b&&e.voulu){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  if(!e.attente) envoyerLike(id);
}
function envoyerLike(id){
  var e=LK[id]; e.attente=true;
  post('kom_like',{appareil:appareil(),cible:id}).then(function(r){
    e.conf={jaime:r.jaime,likes:r.likes};
    if(r.jaime!==e.voulu) return envoyerLike(id);   // l'utilisateur a re-touché entre-temps
    e.attente=false; poserLike(id,r.jaime,r.likes);
  }).catch(function(err){ e.attente=false; e.voulu=e.conf.jaime; poserLike(id,e.conf.jaime,e.conf.likes); msg('mKom',esc(err.message)); });
}
function siyale(id){ if(!confirm(T('konfimeSiyale'))) return; post('kom_siyale',{appareil:appareil(),cible:id}).then(function(){ msg('mKom',esc(T('siyaleOk')),'ok'); }).catch(function(){}); }

// ---------- Démarrage ----------
emojis('emo1','nTeks'); emojis('emo2','kTeks'); fotoZone(); modoBarre();
langue(lire('masbet_lang')||'ht');
tri('aktif');
(function(){ var m=/[#&]sije=([A-Z0-9]+)/i.exec(location.hash||''); if(m) ouvri(m[1]); else if(/^#notif\b/.test(location.hash)) klochOuvri(); })();
klochChaje(); KLT=setInterval(klochChaje,60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) klochChaje(); });
</script>
