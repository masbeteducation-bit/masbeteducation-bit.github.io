function prodVec(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

function plier(cases){
  var cle=function(x,y){ return x+','+y; }, pos={}, res={}, file=[0];
  cases.forEach(function(c,i){ pos[cle(c[0],c[1])]=i; });

  while(file.length){

    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(dd){

var CROIX=[[1,0],[0,1],[1,1],[2,1],[1,2],[1,3]];
/** Patron au hasard : 6 cases collées qui se plient en cube (les 11 patrons possibles peuvent sortir). */

      t=[A('Ou achte '+n+' '+ART.ht[it]+' a '+pr+' goud chak. Ou bay '+B+' goud. Konbyen kòb yo dwe remèt ou ?','Vous achetez '+n+' '+(n>1?ART.fn[it]:ART.f1[it])+' à '+pr+' gourdes l\'unité. Vous donnez '+B+' gourdes. Combien doit-on vous rendre ?')];
      e=[(n>1?n+' × '+pr+' = '+tot+' ; ':'')+B+' − '+tot+' = '+rep+' '+A('goud','gourdes')]; d=5; extra=[B-pr, tot]; }

function sudBoite(n){ return n===4?[2,2]:n===6?[2,3]:[3,3]; }

  var b=sudBoite(n), r=Math.floor(i/n), c=i%n, pris={}, r0=Math.floor(r/b[0])*b[0], c0=Math.floor(c/b[1])*b[1], k, l, res=[];
  for(k=0;k<n;k++){ pris[g[r*n+k]]=1; pris[g[k*n+c]]=1; }
  for(k=0;k<b[0];k++) for(l=0;l<b[1];l++) pris[g[(r0+k)*n+c0+l]]=1;
  for(k=1;k<=n;k++) if(!pris[k]) res.push(k);

}
function sudVide(g,n){ var best=-1, bc=null; for(var i=0;i<n*n;i++) if(!g[i]){ var c=sudCand(g,n,i); if(!bc||c.length<bc.length){ bc=c; best=i; if(c.length<2) break; } } return [best,bc]; }

  var tot=0; for(var k=0;k<c.length&&tot<lim;k++){ g[i]=c[k]; tot+=sudCompter(g,n,lim-tot); } g[i]=0; return tot;
}
function sudRemplir(g,n){
  var v=sudVide(g,n), i=v[0]; if(i<0) return true; var c=melanger(v[1]);
  for(var k=0;k<c.length;k++){ g[i]=c[k]; if(sudRemplir(g,n)) return true; } g[i]=0; return false;
}

  var g=[]; for(var i=0;i<n*n;i++) g.push(0); sudRemplir(g,n); var sol=g.slice(), garder={4:6,6:14,9:30}[n], nb=n*n;
  melanger(Object.keys(g).map(Number)).forEach(function(i){ if(nb<=garder) return; var v=g[i]; g[i]=0; if(sudCompter(g.slice(),n,2)===1) nb--; else g[i]=v; });
  return {g:g, sol:sol};
}

  var b=sudBoite(n), mal={};

    for(var j=0;j<n*n;j++){ if(j===i||g[j]!==g[i]) continue; var r2=Math.floor(j/n), c2=j%n;
      if(r===r2||c===c2||(Math.floor(r/b[0])===Math.floor(r2/b[0])&&Math.floor(c/b[1])===Math.floor(c2/b[1]))) mal[i]=1; } }
  return mal;
}

function memMontrer(){

var TICK=null;

function puzNoter(id,n,temps,coups){

}

function puzDebut(){ if(!P.t0) P.t0=Date.now(); }

// ---------- Taquin ----------
function taqInit(){
  var n=P.n, t=[], i; for(i=1;i<n*n;i++) t.push(i); t.push(0);
  do { var e=n*n-1, prev=-1; for(i=0;i<(n===3?150:320);i++){ var v=[e-n,e+n,(e%n)?e-1:-1,(e%n<n-1)?e+1:-1].filter(function(x){ return x>=0&&x<n*n&&x!==prev; }), x=choisir(v); t[e]=t[x]; t[x]=0; prev=e; e=x; } }
  while(taqFini(t));
  P.t=t; taqRendu();
}
function taqFini(t){ for(var i=0;i<t.length-1;i++) if(t[i]!==i+1) return false; return true; }
function taqRendu(){
  var n=P.n;
  document.getElementById('zone').innerHTML='<div class="card">'+puzTete()+'<div class="taq" style="grid-template-columns:repeat('+n+',1fr)">'+P.t.map(function(v,i){ return v?'<button type="button" data-t="'+i+'"'+(v===i+1?' class="place"':'')+'>'+v+'</button>':'<span class="vide"></span>'; }).join('')+'</div>'+puzQuitter()+'</div>';
}
function taqJouer(i){
  if(P.fini) return; var n=P.n, e=P.t.indexOf(0), ri=Math.floor(i/n), re=Math.floor(e/n), pas;
  if(ri===re) pas=i>e?1:-1; else if(i%n===e%n) pas=i>e?n:-n; else { SONS.refus(); return; }
  puzDebut(); while(e!==i){ var x=e+pas; P.t[e]=P.t[x]; P.t[x]=0; e=x; P.coups++; }
  SONS.clic(); taqRendu(); if(taqFini(P.t)) puzGagne();
}

// ---------- Tour de Hanoï ----------
function hanInit(){ var a=[]; for(var k=P.n;k>=1;k--) a.push(k); P.pic=[a,[],[]]; P.sel=-1; hanRendu(''); }
function hanRendu(msg){
  var n=P.n, coul=['#1f5fbf','#c0392b','#1d8a4e','#d97706','#7c3aed'];
  document.getElementById('zone').innerHTML='<div class="card">'+puzTete()+'<div class="han">'+P.pic.map(function(p,k){
    return '<button type="button" class="pic'+(P.sel===k?' sel':'')+'" data-p="'+k+'" aria-label="'+A('Poto ','Piquet ')+(k+1)+'"><span class="tige"></span>'+
      p.map(function(d,h){ return '<span class="dq'+(P.sel===k&&h===p.length-1?' lev':'')+'" style="width:'+(28+66*d/n)+'%;bottom:'+(10+h*20)+'px;background:'+coul[(d-1)%5]+'"></span>'; }).join('')+'<span class="socle"></span></button>';
  }).join('')+'</div><div class="lbl" id="hanMsg">'+(msg||A('Touche yon poto pou pran plato ki anlè a, epi touche poto kote w vle mete l.','Touchez un piquet pour prendre le disque du dessus, puis le piquet où le poser.'))+'</div>'+puzQuitter()+'</div>';
}
function hanJouer(k){
  if(P.fini) return; var p=P.pic;
  if(P.sel<0){ if(p[k].length){ P.sel=k; SONS.clic(); } return hanRendu(); }
  if(P.sel===k){ P.sel=-1; return hanRendu(); }
  var a=p[P.sel][p[P.sel].length-1], b=p[k][p[k].length-1];
  if(b&&b<a){ P.sel=-1; SONS.refus(); return hanRendu('<b class="ko">'+A('Ou pa ka mete yon gwo plato sou yon piti.','Impossible de poser un grand disque sur un petit.')+'</b>'); }
  puzDebut(); p[k].push(p[P.sel].pop()); P.sel=-1; P.coups++; SONS.clic(); hanRendu();
  if(p[2].length===P.n) puzGagne();
}

// ---------- Sudoku ----------
function sudInit(){ var s=sudGen(P.n); P.sol=s.sol; P.fixe=s.g.map(function(v){ return v>0; }); P.g=s.g.slice(); P.sel=P.g.indexOf(0); puzDebut(); sudRendu(); }

function jourCle(d){ d=d||new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function prog(){ var p=null; try{ p=JSON.parse(lire('masbet_jeu_prog')||'null'); }catch(e){} p=p||{}; p.xp=p.xp||0; p.serie=p.serie||{der:'',n:0,max:0}; p.joues=p.joues||{}; p.badges=p.badges||{}; p.defi=p.defi||''; return p; }

function xpPour(id,r){

  if(id==='baraj') return Math.max(0,r.pts)*2;

  if(id==='han') return r.n*15+(r.coups===Math.pow(2,r.n)-1?20:0);

  if(df.j===id&&p.defi!==auj&&df.ok(r)){ p.defi=auj; gain+=50; defiFait=true; }
  p.xp+=gain;
  var gagner=function(b){ if(!p.badges[b]){ p.badges[b]=auj; nv.push(b); } };

  if(p.serie.n>=3) gagner('seri3'); if(p.serie.n>=7) gagner('seri7');

    '<div class="pts3" style="margin:0 0 10px">'+devPoints(e)+'</div><div class="dq">'+esc(q.q)+'</div>'+
    (e.ind[i]?'<div class="ind">💡 '+esc(q.ind)+'</div>':'<button type="button" class="bInd" id="devInd">💡 '+A('Ban m yon endis','Un indice')+'</button>')+
    '<div class="chx'+(long?' long':'')+'">'+q.ch.map(function(c,k){ return '<button type="button" data-dv="'+k+'">'+esc(c)+'</button>'; }).join('')+'</div><div id="ex"></div></div>'+
    '<button type="button" class="btn sec plein" data-menu="1">'+A('Lòt jwèt','Autres jeux')+'</button>';
  window.scrollTo(0,0);
}
function devIndice(){ var e=devEtat(); if(!P||P.dev==null) return; e.ind[P.dev]=true; devEcrire(e); SONS.clic(); devEcran(); }
function devRepondre(k){
  var e=devEtat(), i=P&&P.dev; if(i==null||e.r[i]!=null) return;
  var q=P.L[i], ok=k===q.bon; e.r[i]={c:k,ok:ok}; devEcrire(e); if(ok) SONS.bon(); else SONS.mal();
  document.querySelectorAll('#zone .chx button').forEach(function(b,j){ b.disabled=true; if(j===q.bon) b.classList.add('bon'); else if(j===k) b.classList.add('mal'); });
  var bInd=document.getElementById('devInd'); if(bInd) bInd.remove();
  document.querySelector('#zone .pts3').innerHTML=devPoints(e);
  document.getElementById('ex').innerHTML='<div class="expl">'+(ok?'<b class="ok">'+A('Bravo !','Bravo !')+'</b> ':'<b class="ko">'+A('Non.','Non.')+'</b> '+A('Repons lan se ','La réponse est ')+'<b>'+esc(q.rep)+'</b>. ')+esc(q.ex)+'</div>'+
    '<button type="button" class="patB" id="devPat"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="vertical-align:-3px"><path fill="currentColor" d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 8.8C7.5 8.3 6.8 8 6 8c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg> '+A('Pataje devinèt sa a','Partager cette énigme')+'</button>'+
    '<div style="margin-top:10px"><button type="button" class="btn plein" id="devSuite">'+(e.r.indexOf(null)<0?A('Wè rezilta a','Voir le résultat'):A('Pwochen devinèt','Énigme suivante'))+'</button></div>';
}
function devFin(){
  var e=devEtat(), L=devListe(), b=e.r.filter(function(x){ return x&&x.ok; }).length, ind=e.ind.some(function(x){ return x; }), bloc='';
  if(!e.fini){
    var xp=e.r.reduce(function(s,x,i){ return s+(x&&x.ok?(e.ind[i]?10:20):0); },0)+(b===3?10:0);
    e.fini=true; devEcrire(e); bloc=progres('dev',{bons:b,nb:3,xp:xp,ind:ind}); SONS.fin(); statEv('dev');
    var tot=null; try{ tot=JSON.parse(lire('masbet_psiko_dev_tot')||'null'); }catch(x){} tot=tot||{bons:0,jou:0}; tot.bons+=b; tot.jou++; ecrire('masbet_psiko_dev_tot',JSON.stringify(tot));
  }
  var tot2=null; try{ tot2=JSON.parse(lire('masbet_psiko_dev_tot')||'null'); }catch(x){}
  document.getElementById('zone').innerHTML='<div class="card res"><div class="sous">'+esc(jeuParId('dev').nom())+'</div><div class="gros">'+b+' / 3</div>'+
    '<div class="sous">'+(b===3?A('Ekselan !','Excellent !'):b===2?A('Byen jwe !','Bien joué !'):A('Demen w ap fè pi byen !','Demain sera meilleur !'))+'</div>'+bloc+
    (tot2?'<div class="sous" style="margin-top:6px">'+A('Total : '+tot2.bons+' devinèt jwenn an '+tot2.jou+' jou','Total : '+tot2.bons+' énigmes trouvées en '+tot2.jou+' jours')+'</div>':'')+
    '<div class="recap">'+L.map(function(q,i){ var x=e.r[i]; return '<div>'+(x&&x.ok?'✅':'❌')+' '+esc(q.q.split('\n')[0])+'<b>'+esc(q.rep)+'</b></div>'; }).join('')+'</div>'+
    '<div class="sous">⏰ '+A('3 nouvo devinèt demen maten.','3 nouvelles énigmes demain matin.')+'</div>'+
    '<button type="button" class="patB" id="devPatRes"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="vertical-align:-3px"><path fill="currentColor" d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 8.8C7.5 8.3 6.8 8 6 8c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg> '+A('Pataje rezilta m','Partager mon résultat')+'</button>'+
    '<div class="actions" style="margin-top:10px"><button type="button" class="btn sec" data-menu="1">'+A('Lòt jwèt','Autres jeux')+'</button><a class="btn sec" href="index.html#akey" style="text-align:center">'+A('Akèy','Accueil')+'</a></div></div>';
  window.scrollTo(0,0);
}
function devPartager(txt){
  statEv('partage');
  if(window.masbetPataje) return masbetPataje({texte:txt, url:SITE_JEU+'#dev', titre:A('Devinèt Masbet','Énigmes Masbet')});
  if(navigator.share){ navigator.share({text:txt,url:SITE_JEU+'#dev'}).catch(function(){}); return; }
  window.open('https://wa.me/?text='+encodeURIComponent(txt+'\n'+SITE_JEU+'#dev'),'_blank','noopener');
}
function devPatajeQ(){
  if(!P||P.dev==null) return; var q=P.L[P.dev];
  devPartager('💡 '+A('Devinèt Masbet','Énigme Masbet')+'\n'+q.q+'\n\n'+q.ch.map(function(c,i){ return 'ABCD'.charAt(i)+') '+c; }).join('\n')+'\n\n'+A('Èske w ka jwenn li ? Repons lan nan aplikasyon an :','Saurez-vous la trouver ? Réponse dans l\'application :'));
}
function devPatajeRes(){
  var e=devEtat(), b=e.r.filter(function(x){ return x&&x.ok; }).length;
  devPartager('💡 '+A('Mwen jwenn '+b+' / 3 devinèt jodi a sou Masbet ','J\'ai trouvé '+b+' / 3 énigmes du jour sur Masbet ')+e.r.map(function(x){ return x&&x.ok?'🟩':'🟥'; }).join('')+'\n'+A('Eseye tou, se gratis :','À vous de jouer, c\'est gratuit :'));
}
function recCourt(j){
  if(j.gr==='pez'){ for(var k=0;k<j.tailles.length;k++){ var r=puzRecord(j.id,j.tailles[k]); if(r) return j.taille(j.tailles[k])+' · '+duree(r.temps); } return ''; }
  var x=record(j.id); if(!x) return '';
  if(j.id==='mem') return x.pts+' '+A('chif','chiffres'); if(j.id==='rez') return Math.round(x.pts/1000)+' 000 G'; if(j.id==='baraj') return x.pts+' pts';
  return x.pts+' / '+x.total;
}
function menu(){
  arreterChrono(); clearInterval(TICK); ECRAN='menu'; JEU=null; P=null;
  var carte=function(j){ var r=recCourt(j);
    return '<button type="button" class="gc" data-jouer="'+j.id+'" style="--c:'+FAM[j.id]+'">'+logo(j.id)+'<b>'+esc(j.nom())+'</b><small>'+esc(COURT[j.id][LANG==='fr'?1:0])+'</small>'+
      (r?'<span class="med">🏅 '+esc(r)+'</span>':'<span class="nouvo">'+A('NOUVO','NOUVEAU')+'</span>')+'</button>'; };
  var gr=function(g){ return '<div class="gg">'+JEUX.filter(function(j){ return j.gr===g; }).map(carte).join('')+'</div>'; };
  document.getElementById('zone').innerHTML=blocProgression()+devCarte()+
    '<div class="secTit"><span>'+A('Tès sikoteknik','Tests psychotechniques')+'</span>'+boutonSon()+'</div>'+gr('psi')+
    '<div class="secTit"><span>'+A('Pezèl','Casse-tête')+'</span></div>'+gr('pez')+
    '<div class="secTit"><span>'+A('Jesyon','Gestion')+'</span></div>'+gr('ges')+
    '<p class="note">'+A('Tès sikoteknik yo fè w abitye ak fòma tès konkou yo, epi yo antrene vitès ou ; yo pa mezire entèlijans ou. Pwen, nivo, badj ak nòt ou rete sou telefòn ou.','Les tests psychotechniques vous habituent au format des concours et entraînent votre rapidité ; ils ne mesurent pas votre intelligence. Points, niveaux, badges et scores restent sur votre téléphone.')+'</p>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button'); if(!b) return;
  if(b.dataset.jouer||b.dataset.rejouer) return lancer(b.dataset.jouer||b.dataset.rejouer);
  if(b.dataset.menu) { menu(); window.scrollTo(0,0); return; }
  if(b.id==='son'){ SON=!SON; ecrire('masbet_psiko_son',SON?'1':'0'); document.querySelectorAll('#son').forEach(function(x){ x.textContent=SON?'🔊':'🔇'; }); if(SON) SONS.clic(); return; }
  if(b.dataset.taille&&JEU) return puzDemarrer(+b.dataset.taille);
  if(b.dataset.t!=null&&P&&JEU&&JEU.id==='taq') return taqJouer(+b.dataset.t);
  if(b.dataset.p!=null&&P&&JEU&&JEU.id==='han') return hanJouer(+b.dataset.p);
  if(b.dataset.c!=null&&P&&JEU&&JEU.id==='sud') return sudCase(+b.dataset.c);
  if(b.dataset.n!=null&&P&&JEU&&JEU.id==='sud') return sudChiffre(+b.dataset.n);
  if(b.dataset.m!=null&&P&&JEU&&JEU.id==='mem') return memTouche(b.dataset.m);
  if(b.id==='memgo'||b.id==='memsuite') return b.id==='memgo'?memMontrer():memSuite();
  if(b.id==='qgo') return questionSuivante();
  if(b.id==='voirBadges') return ecranBadges();
  if(b.dataset.dv!=null&&!b.disabled) return devRepondre(+b.dataset.dv);
  if(b.id==='devInd') return devIndice();
  if(b.id==='devSuite') return devEcran();
  if(b.id==='devPat') return devPatajeQ();
  if(b.id==='devPatRes') return devPatajeRes();
  if(b.dataset.prix!=null&&P&&JEU&&JEU.id==='rez'&&!P.fini){ P.prix=+b.dataset.prix; SONS.clic(); return rezRendu(); }
  if(b.dataset.act&&P&&JEU&&JEU.id==='rez') return rezAction(b.dataset.act);
  if(b.id==='go') return barrageJouer();
  if(b.id==='fini') return barrageFin();
  if(b.id==='suite') return questionSuivante();
  if(b.dataset.k!=null&&P&&!P.fini){ var k=+b.dataset.k; P.m[k]=!P.m[k]; b.classList.toggle('m',P.m[k]); SONS.clic(); return; }
  if(b.dataset.i!=null&&P&&!b.disabled&&ECRAN==='jeu') repondre(+b.dataset.i);
});
function textes(){
  document.getElementById('titre').textContent='🧩 '+A('Jwèt lespri','Jeux d\'esprit');
  document.getElementById('sous').textContent=A('Jwe, antrene w pou konkou yo, monte nivo epi ranmase badj. Gratis.','Jouez, préparez les concours, montez de niveau et collectionnez les badges. Gratuit.');

  var n=LANG==='fr'?['Accueil','Acheter','Matchs','Live','Communauté']:['Akèy','Achte','Match','Live','Kominote'];

}
function langue(l){
  LANG=l==='fr'?'fr':'ht'; ecrire('masbet_lang',LANG); document.documentElement.lang=LANG;
  document.getElementById('lHt').classList.toggle('on',LANG==='ht'); document.getElementById('lFr').classList.toggle('on',LANG==='fr');
  textes(); if(ECRAN==='menu') menu(); else if(ECRAN==='badges') ecranBadges(); else if(JEU&&JEU.id==='dev'&&P&&P.dev!=null&&!document.querySelector('#zone .chx button:disabled')) devEcran();   // pendant une partie, la langue change à l'écran suivant
}
langue(lire('masbet_lang')||'ht'); menu();
if(window.masbetAffiche) masbetAffiche();   // v42.16 : contenu affiché (temps d'attente d'un nouveau téléphone)
if(/^#dev\b/.test(location.hash)) lancer('dev');
window.addEventListener('hashchange',function(){ if(/^#dev\b/.test(location.hash)) lancer('dev'); });
</script>
