/* QR code minimal (octets, correction M, versions 1-10) — écrit pour Masbet, sans bibliothèque externe */
function qrMatrice(texte){
  var oct=unescape(encodeURIComponent(texte)).split('').map(function(c){ return c.charCodeAt(0); });
  var T=[null,[26,10,[[1,16]]],[44,16,[[1,28]]],[70,26,[[1,44]]],[100,18,[[2,32]]],[134,24,[[2,43]]],[172,16,[[4,27]]],[196,18,[[4,31]]],[242,22,[[2,38],[2,39]]],[292,22,[[3,36],[2,37]]],[346,26,[[4,43],[1,44]]]];
  var AL=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  var v=1,cap; for(;v<=10;v++){ cap=T[v][2].reduce(function(s,b){ return s+b[0]*b[1]; },0); if(4+8+8*oct.length<=cap*8) break; }
  if(v>10) throw new Error('texte trop long');
  var bits=[]; function ajoute(val,n){ for(var i=n-1;i>=0;i--) bits.push((val>>>i)&1); }
  ajoute(4,4); ajoute(oct.length,8); oct.forEach(function(b){ ajoute(b,8); });
  ajoute(0,Math.min(4,cap*8-bits.length)); while(bits.length%8) bits.push(0);
  var data=[]; for(var i=0;i<bits.length;i+=8){ var b=0; for(var j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
  for(var p=0;data.length<cap;p++) data.push(p%2?0x11:0xEC);
  function mul(x,y){ var z=0; for(var i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z&255; }
  var deg=T[v][1], div=[]; for(var i=0;i<deg;i++) div.push(0); div[deg-1]=1; var root=1;
  for(var i=0;i<deg;i++){ for(var j=0;j<deg;j++){ div[j]=mul(div[j],root); if(j+1<deg) div[j]^=div[j+1]; } root=mul(root,2); }
  function reste(d){ var r=div.map(function(){ return 0; }); d.forEach(function(b){ var f=b^r.shift(); r.push(0); div.forEach(function(c,i){ r[i]^=mul(c,f); }); }); return r; }
  var blocs=[], k=0; T[v][2].forEach(function(g){ for(var n=0;n<g[0];n++){ var d=data.slice(k,k+g[1]); k+=g[1]; blocs.push({d:d,e:reste(d)}); } });
  var fin=[], mx=Math.max.apply(null,blocs.map(function(b){ return b.d.length; }));
  for(var i=0;i<mx;i++) blocs.forEach(function(b){ if(i<b.d.length) fin.push(b.d[i]); });
  for(var i=0;i<deg;i++) blocs.forEach(function(b){ fin.push(b.e[i]); });
  var N=v*4+17, M=[], F=[]; for(var y=0;y<N;y++){ M.push([]); F.push([]); for(var x=0;x<N;x++){ M[y].push(false); F[y].push(false); } }
  function fx(x,y,d){ M[y][x]=!!d; F[y][x]=true; }
  for(var i=0;i<N;i++){ fx(6,i,i%2===0); fx(i,6,i%2===0); }
  [[3,3],[N-4,3],[3,N-4]].forEach(function(c){ for(var dy=-4;dy<=4;dy++) for(var dx=-4;dx<=4;dx++){ var xx=c[0]+dx, yy=c[1]+dy; if(xx<0||yy<0||xx>=N||yy>=N) continue; var di=Math.max(Math.abs(dx),Math.abs(dy)); fx(xx,yy,di!==2&&di!==4); } });
  var a=AL[v]; for(var i=0;i<a.length;i++) for(var j=0;j<a.length;j++){ if((i===0&&j===0)||(i===0&&j===a.length-1)||(i===a.length-1&&j===0)) continue;
    for(var dy=-2;dy<=2;dy++) for(var dx=-2;dx<=2;dx++) fx(a[i]+dx,a[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }
  var MASQUE=2;
  function format(){ var d=(0<<3)|MASQUE, r=d; for(var i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537); var b=((d<<10)|r)^0x5412, g=function(i){ return (b>>>i)&1; };
    for(var i=0;i<=5;i++) fx(8,i,g(i)); fx(8,7,g(6)); fx(8,8,g(7)); fx(7,8,g(8)); for(var i=9;i<15;i++) fx(14-i,8,g(i));
    for(var i=0;i<8;i++) fx(N-1-i,8,g(i)); for(var i=8;i<15;i++) fx(8,N-15+i,g(i)); fx(8,N-8,1); }
  format();
  if(v>=7){ var r=v; for(var i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); var vb=(v<<12)|r;
    for(var i=0;i<18;i++){ var bt=(vb>>>i)&1, aa=N-11+i%3, bb=Math.floor(i/3); fx(aa,bb,bt); fx(bb,aa,bt); } }
  var i=0; for(var droite=N-1;droite>=1;droite-=2){ if(droite===6) droite=5;
    for(var vert=0;vert<N;vert++) for(var j=0;j<2;j++){ var x=droite-j, haut=((droite+1)&2)===0, y=haut?N-1-vert:vert;
      if(!F[y][x] && i<fin.length*8){ M[y][x]=((fin[i>>>3]>>>(7-(i&7)))&1)===1; i++; } } }

  return M;
}

// ---------- Billets gardés sur ce téléphone ----------
function mesTikes(){ try{ var a=JSON.parse(lire('masbet_fn_tikes')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function garderTike(t){ var a=mesTikes().filter(function(x){ return x.n!==t.n; }); a.unshift({n:t.n,non:t.non,j:t.j,bonus:t.bonus,forfait:t.forfait,ev:t.ev||null}); ecrire('masbet_fn_tikes',JSON.stringify(a.slice(0,10))); }
function lienVerif(j){ return 'https://masbet.me/tikan/plas?b='+j; }

// ---------- Image du billet (canvas 1080×1500) ----------
var LOGO=new Image(); LOGO.src='/logo.png';
function imageTike(t){
  // v147 : une soirée peut avoir 2 ou 3 matchs → un match par ligne sous la date ; le reste du billet descend d'autant
  var ev=t.ev||{kind:'final',prix:500}, fin=ev.kind!=='match', cv=$('cv'), W=1080, I=T('tImg');
  var lignes=(!fin && ev.lib)? String(ev.lib).split(/\s*·\s*/).filter(Boolean).slice(0,4) : [];
  var D=lignes.length? lignes.length*44-10 : 0;            // décalage vertical dû aux lignes des matchs
  var H=(t.bonus?1840:1500)+D; cv.width=W; cv.height=H; var c=cv.getContext('2d');
  var g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,'#14213d'); g.addColorStop(1,'#1d3366'); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle='#fca311'; c.fillRect(0,0,W,16); c.fillRect(0,H-16,W,16);
  if(LOGO.complete&&LOGO.naturalWidth){ c.save(); c.beginPath(); c.arc(W/2,150,78,0,7); c.fillStyle='#fff'; c.fill(); c.clip(); c.drawImage(LOGO,W/2-70,80,140,140); c.restore(); }
  c.textAlign='center'; c.fillStyle='#ffd77a'; c.font='800 46px system-ui,Arial,sans-serif'; c.fillText(fin?I.t1:I.t1m,W/2,300);
  c.fillStyle='#fff'; c.font='900 92px system-ui,Arial Black,sans-serif'; c.fillText(I.t2,W/2,400);
  c.fillStyle='#c9d3ea'; c.font='600 38px system-ui,Arial,sans-serif'; c.fillText(fin?I.dat:(ev.dat||'')+' · '+I.souPon,W/2,462);
  lignes.forEach(function(l,k){ c.fillStyle='#ffd77a'; var f=34; c.font='700 '+f+'px system-ui,Arial,sans-serif';
    while(f>20 && c.measureText('⚽ '+l).width>W-140){ f-=2; c.font='700 '+f+'px system-ui,Arial,sans-serif'; }
    c.fillText((lignes.length>1?'⚽ ':'')+l,W/2,510+k*44); });
  // zone blanche
  var x0=90, y0=520+D, w=W-180, h=860; c.fillStyle='#fff'; arrondi(c,x0,y0,w,h,36); c.fill();
  c.fillStyle='#5d6782'; c.font='700 30px system-ui,Arial,sans-serif'; c.fillText(I.plas,W/2,590+D);
  c.fillStyle='#14213d'; c.font='900 120px ui-monospace,Menlo,Consolas,monospace'; c.fillText(t.n,W/2,705+D);
  c.fillStyle='#5d6782'; c.font='700 30px system-ui,Arial,sans-serif'; c.fillText(I.non,W/2,775+D);
  c.fillStyle='#14213d'; var fs=t.non.length>22?46:58; c.font='800 '+fs+'px system-ui,Arial,sans-serif'; c.fillText(t.non,W/2,840+D);
  var M=qrMatrice(lienVerif(t.j)), N=M.length, q=440, m=q/(N+8), qx=W/2-q/2, qy=880+D;
  c.fillStyle='#fff'; c.fillRect(qx,qy,q,q); c.fillStyle='#000';
  for(var y=0;y<N;y++) for(var x=0;x<N;x++) if(M[y][x]) c.fillRect(Math.floor(qx+(x+4)*m),Math.floor(qy+(y+4)*m),Math.ceil(m),Math.ceil(m));
  c.fillStyle='#5d6782'; c.font='600 28px system-ui,Arial,sans-serif'; c.fillText(I.verif,W/2,1350+D);
  c.fillStyle='#ffd77a'; c.font='800 40px system-ui,Arial,sans-serif'; c.fillText((ev.prix||500)+' HTG · LAPCSSSA · masbet.me',W/2,1450+D);
  if(t.bonus){   // v147 : coupon Wi-Fi MasbetAirNet en bas du billet, séparé par un pointillé
    c.strokeStyle='#ffd77a'; c.lineWidth=4; c.setLineDash([18,14]); c.beginPath(); c.moveTo(40,1500+D); c.lineTo(W-40,1500+D); c.stroke(); c.setLineDash([]);
    c.fillStyle='#fff'; arrondi(c,90,1540+D,W-180,240,30); c.fill();
    c.fillStyle='#14213d'; c.font='800 34px system-ui,Arial,sans-serif'; c.fillText(I.wifi+' · '+(t.forfait||(fin?'50 goud':'25 goud')).toUpperCase(),W/2,1600+D);
    c.font='900 78px ui-monospace,Menlo,Consolas,monospace'; c.fillText(t.bonus,W/2,1690+D);
    c.fillStyle='#5d6782'; c.font='600 28px system-ui,Arial,sans-serif'; c.fillText(I.wifiAide,W/2,1745+D);
  }
  return cv.toDataURL('image/png');
}
function arrondi(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function afficherTikes(entete){
  var a=mesTikes(); if(!a.length){ $('vTikes').innerHTML=''; return; }
  $('vTikes').innerHTML=a.map(function(t,i){ var src=imageTike(t);
