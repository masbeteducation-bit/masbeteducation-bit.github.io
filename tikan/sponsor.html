<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Sponsò — Tikan Ansavo 6</title>
<meta name="description" content="Sipòte chanpyona Tikan Ansavo 6 an liy ak MonCash oswa NatCash : non w ap parèt nan live match yo sou Masbet.">
<meta property="og:title" content="Vin sponsò Tikan Ansavo 6">
<meta property="og:description" content="Peye an liy ak MonCash oswa NatCash : non w parèt otomatikman nan live match yo.">

<style>
:root{--navy:#14213d;--or:#fca311;--cyan:#06B6D4;--bg:#eef1f7;--carte:#fff;--fg:#14213d;--doux:#5d6782;--ligne:#dfe4ee;--ok:#1d8a4e;--err:#c0392b;--wait:#b76e00;--champ:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--carte:#141e33;--fg:#e6ecf7;--doux:#9aa7c2;--ligne:#26324d;--champ:#0f182b}}
:root[data-theme="dark"]{--bg:#0d1424;--carte:#141e33;--fg:#e6ecf7;--doux:#9aa7c2;--ligne:#26324d;--champ:#0f182b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#14213d 0%,#1c2f58 100%);color:#fff;padding:14px 16px 18px}
.top{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top img{width:38px;height:38px;border-radius:9px;background:#fff}
.top .t{flex:1;min-width:0}.top .t small{display:block;color:#ffd77a;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top .t b{display:block;font-size:19px;line-height:1.2}
.lang{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px}
main{max-width:640px;margin:0 auto;padding:12px 16px 48px}
.carte{background:var(--carte);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:16px 0 6px}
.doux{color:var(--doux);font-size:13.5px}
.etat{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px}
.p-ok{background:#e3f6ec;color:var(--ok)}.p-no{background:#fdecea;color:var(--err)}
.barre{height:10px;background:var(--ligne);border-radius:99px;overflow:hidden;margin:10px 0 4px}.barre i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#38d6ee)}
.chif{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.chif div{background:var(--bg);border-radius:12px;padding:8px;text-align:center}.chif b{display:block;font-size:20px}.chif span{font-size:12px;color:var(--doux)}
.onglets{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px;padding-bottom:2px;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{flex:0 0 auto;border:0;border-radius:99px;padding:9px 14px;background:var(--carte);color:var(--doux);font-weight:800;font-size:14px;box-shadow:0 1px 2px rgba(20,33,61,.08)}
.onglets button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .onglets button.on{background:var(--cyan);color:#06121f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .onglets button.on{background:var(--cyan);color:#06121f}}
.cache{display:none!important}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--ligne);border-radius:11px;font:inherit;font-size:16px;background:var(--champ);color:var(--fg)}
input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.kat button{border:2px solid var(--ligne);background:var(--champ);color:var(--fg);border-radius:12px;padding:10px;font:inherit;font-weight:800;text-align:left}
.kat button small{display:block;font-weight:600;color:var(--doux);font-size:12.5px}
.kat button.on{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
.jwe{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,.7fr) 58px;gap:6px;align-items:center;margin-bottom:6px}
.jwe span{font-size:12px;font-weight:800;color:var(--doux);text-align:center}
.jwe input{padding:9px 8px;font-size:15px}
.jwe.ob span{color:var(--cyan)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:16px;background:var(--or);color:var(--navy);text-align:center;text-decoration:none;margin-top:14px}
.btn.sec{background:var(--bg);color:var(--fg);border:1.5px solid var(--ligne)}
.btn:disabled{opacity:.55}
.kod{display:flex;gap:8px}.kod input{text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.06em}
.kod button{flex:0 0 auto;border:0;border-radius:11px;padding:0 14px;background:var(--navy);color:#fff;font-weight:800}
.msg{padding:10px 12px;border-radius:11px;margin-top:10px;font-size:14.5px}
.msg.ok{background:#e3f6ec;color:#11683a}.msg.err{background:#fdecea;color:#a42c20}.msg.info{background:#e6f8fb;color:#0e6475}
.logoz{display:flex;align-items:center;gap:10px}
.logoz .v{width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--ligne);background:var(--champ) center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--doux)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}.chk input{width:20px;height:20px;flex:0 0 20px;margin-top:2px}
.regles{margin:0;padding-left:18px;font-size:14px}.regles li{margin:3px 0}
details summary{cursor:pointer;font-weight:800}
.ek{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ligne)}
.ek:first-child{border-top:0}
.ek .ini{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--doux);flex:0 0 36px}
.ek .nm{flex:1;min-width:0}.ek .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ek .nm small{color:var(--doux)}
.st{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap}
.st-AVANS{background:#fff3df;color:var(--wait)}.st-PEYE{background:#e3f6ec;color:var(--ok)}.st-AKSEPTE{background:var(--ok);color:#fff}
.st-PA{background:#fdecea;color:var(--err)}.st-RANB{background:var(--bg);color:var(--doux)}.st-FI{background:#f3e8ff;color:#7b2cbf}
.recu{border:2px solid var(--cyan);border-radius:14px;padding:14px;text-align:center}
.recu .n{font-family:ui-monospace,Menlo,monospace;font-size:28px;font-weight:900;letter-spacing:.04em}
footer{text-align:center;color:var(--doux);font-size:12.5px;padding:8px 16px 30px}
.demo{background:#fff3df;color:#8a5a00;text-align:center;font-size:13px;padding:6px}
.pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.pal div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center;font-weight:900;font-size:18px}.pal small{display:block;font-size:11.5px;color:var(--doux);font-weight:700}
</style>
</head>
<body>
<div id="demo" class="demo cache"></div>
<header><div class="top"><img src="/logo.png" alt="" width="38" height="38"><div class="t"><small>LAPCSSSA · Tikan Ansavo 6</small><b id="tTitre"></b></div>
  <button class="lang" id="bLang" onclick="langue(LANG==='ht'?'fr':'ht')">FR</button></div></header>
<main>
  <section class="carte"><h2 data-t="iTitre"></h2><div class="doux" id="iTxt"></div>
    <div class="pal"><div>1 000<small>HTG</small></div><div>2 500<small>HTG</small></div><div>5 000<small>HTG</small></div><div>10 000<small>HTG</small></div><div>25 000<small>HTG</small></div><div>50 000<small>HTG</small></div></div>
    <a class="btn" href="/achte.html#spons" data-t="bPeye"></a></section>
  <section class="carte"><h2 data-t="fTitre"></h2>
    <label for="kod" data-t="lKod"></label><input id="kod" maxlength="12" placeholder="SP…" autocomplete="off" spellcheck="false" style="text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;font-weight:800">
    <label for="non" data-t="lNon"></label><input id="non" maxlength="40" autocomplete="organization">
    <div class="doux" style="margin-top:6px" data-t="aNon"></div>
    <button class="btn" id="bOk" onclick="voye()" data-t="bOk"></button><div id="fMsg"></div></section>
</main>
<footer>LAPCSSSA · WhatsApp +509 3886-7953 · +509 3553-3817<br>Masbet Education · masbet.me</footer>
<script src="/config.js"></script>
<script>
// Sponsors en ligne — code SP… payé sur Masbet Pay → nom affiché dans le bandeau « AVÈK SIPÒ » du cadre live (projet Contenu, Tikan.gs)
var CONTENU=window.MASBET_CONTENU||'', DEMO=!CONTENU, LANG='ht';
var TXT={
 ht:{titre:'Vin sponsò chanpyona a',iTitre:'🤝 Sipòte Tikan Ansavo 6',iTxt:'Chwazi yon montan, peye ak <b>MonCash oswa NatCash</b> sou paj « Achte », epi ekri non ou vle nou afiche. <b>Non an ap parèt otomatikman</b> nan bann « AVÈK SIPÒ » pandan tout live match yo sou Masbet. Nou pa afiche montan an.',
  bPeye:'💳 Peye kounye a (MonCash / NatCash)',fTitre:'Mwen gen kòd la : afiche non m',lKod:'Kòd sponsò a (SP…), sou paj « Achte » lè w fin peye',lNon:'Non pou n afiche (ou menm, biznis ou, fanmi w…)',
  aNon:'40 karaktè pou pi plis. Pa mete lyen ni nimewo.',bOk:'Afiche non m',ok:function(n){ return 'Mèsi anpil ! <b>'+esc(n)+'</b> ap parèt nan live match yo nan yon minit. 🙏'; },
  chKod:'Antre kòd sponsò a (li kòmanse ak SP).',erreurReseau:'Pa gen rezo. Eseye ankò.',envoi:'Ap voye…'},
 fr:{titre:'Devenir sponsor du championnat',iTitre:'🤝 Soutenir Tikan Ansavo 6',iTxt:'Choisissez un montant, payez par <b>MonCash ou NatCash</b> sur la page « Achte », puis écrivez le nom à afficher. <b>Le nom s\'affiche automatiquement</b> dans le bandeau « AVÈK SIPÒ » pendant tous les lives des matchs sur Masbet. Le montant n\'est pas affiché.',
  bPeye:'💳 Payer maintenant (MonCash / NatCash)',fTitre:'J\'ai le code : afficher mon nom',lKod:'Code sponsor (SP…), reçu sur la page « Achte » après le paiement',lNon:'Nom à afficher (vous, votre entreprise, votre famille…)',
  aNon:'40 caractères au maximum. Pas de lien ni de numéro.',bOk:'Afficher mon nom',ok:function(n){ return 'Merci beaucoup ! <b>'+esc(n)+'</b> apparaîtra dans les lives des matchs d\'ici une minute. 🙏'; },
  chKod:'Entrez le code sponsor (il commence par SP).',erreurReseau:'Pas de réseau. Réessayez.',envoi:'Envoi…'}
};
function T(k){ return TXT[LANG][k]; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lire(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ecrire(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function msg(id,t,c){ $(id).innerHTML=t?'<div class="msg '+(c||'info')+'">'+t+'</div>':''; }
function appareil(){ var a=lire('masbet_appareil'); if(!a){ var al='abcdefghijkmnpqrstuvwxyz23456789'; a='A'; for(var i=0;i<19;i++) a+=al.charAt(Math.floor(Math.random()*al.length)); ecrire('masbet_appareil',a); } return a; }
function errTxt(e){ var m=String(e&&e.message||e||''); return (!m||/NetworkError|Failed to fetch|network|Load failed/i.test(m))?T('erreurReseau'):m; }
function poster(c){ if(DEMO) return new Promise(function(ok,ko){ $('demo').classList.remove('cache'); $('demo').textContent='Mode démonstration : code d\'essai SPDEMO2026.';
    setTimeout(function(){ if(c.kod!=='SPDEMO2026') return ko(new Error('Kòd sponsò a pa bon. Ou jwenn li sou paj « Achte » lè w fin peye (li kòmanse ak SP).')); if(String(c.non||'').trim().length<2) return ko(new Error('Ekri non pou n afiche a (2 lèt omwen).')); ok({non:String(c.non).trim(),montant:5000}); },300); });
  return fetch(CONTENU,{method:'POST',credentials:'omit',cache:'no-store',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(c)})
   .then(function(r){ return r.json(); }).then(function(j){ if(!j||!j.ok) throw new Error(j&&j.erreur||''); return j.data; }); }
function voye(){ var k=String($('kod').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''); $('kod').value=k;
  if(!/^SP[A-Z0-9]{8}$/.test(k)) return msg('fMsg',T('chKod'),'err');
  var b=$('bOk'); b.disabled=true; b.textContent=T('envoi');
  poster({api:'tkn_spon',kod:k,non:$('non').value,appareil:appareil()}).then(function(r){ msg('fMsg',T('ok')(r.non),'ok'); $('kod').value=''; })
   .catch(function(e){ msg('fMsg',esc(errTxt(e)),'err'); }).then(function(){ b.disabled=false; b.textContent=T('bOk'); }); }
function langue(l){ LANG=l==='fr'?'fr':'ht'; ecrire('masbet_lang',LANG); document.documentElement.lang=LANG; $('bLang').textContent=LANG==='ht'?'FR':'KR';
  document.querySelectorAll('[data-t]').forEach(function(el){ var v=T(el.getAttribute('data-t')); if(typeof v==='string') el.textContent=v; });
  $('tTitre').textContent=T('titre'); $('iTxt').innerHTML=T('iTxt'); document.title=T('titre')+' — Tikan Ansavo 6'; }
langue(lire('masbet_lang')==='fr'?'fr':'ht');
(function(){ var m=/[?&]kod=([A-Za-z0-9]+)/.exec(location.search); if(m){ $('kod').value=m[1].toUpperCase(); try{ history.replaceState(null,'',location.pathname); }catch(e){} setTimeout(function(){ $('non').focus(); },300); } })();
</script>
</body>
</html>
