// ---------- Serveur (projet Contenu) ----------
function lireApi(q){
  if(DEMO) return demo(q);
  q._=Date.now(); var u=CONTENU+'?'+Object.keys(q).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(q[k]); }).join('&');
  return fetch(u,{credentials:'omit',cache:'no-store',redirect:'follow'}).then(function(r){ return r.json(); }).then(function(j){ if(!j||!j.ok) throw new Error(j&&j.erreur||''); return j.data; });
}
function poster(c){
  if(DEMO) return demo(c);
  return fetch(CONTENU,{method:'POST',credentials:'omit',cache:'no-store',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(c)})
    .then(function(r){ return r.json(); }).then(function(j){ if(!j||!j.ok) throw new Error(j&&j.erreur||''); return j.data; });
}

function reduire(f,cb){ var url=URL.createObjectURL(f), im=new Image();
  im.onload=function(){ var tailles=[128,112,96,80,64], q=[0.86,0.72,0.58], best='';
    for(var i=0;i<tailles.length&&!best;i++){ var S=tailles[i], cv=document.createElement('canvas'); cv.width=S; cv.height=S;
      var k=Math.min(S/im.width,S/im.height), w=im.width*k, h=im.height*k; cv.getContext('2d').drawImage(im,(S-w)/2,(S-h)/2,w,h);
      for(var j=0;j<q.length;j++){ var d=cv.toDataURL('image/webp',q[j]); if(d.indexOf('data:image/webp')!==0) d=cv.toDataURL('image/png'); if(d.length<=8500){ best=d; break; } } }
    URL.revokeObjectURL(url); cb(best); };
  im.onerror=function(){ URL.revokeObjectURL(url); cb(''); }; im.src=url; }

// v148 : téléphone d'Haïti avec (+509) fixe dans la case, 8 chiffres groupés 2 par 2
function telHaiti(el){ var r=el.value, d=r.replace(/\D/g,'');
  if(/^\s*\(?\+/.test(r)){ if('509'.indexOf(d)===0){ el.value='+'+d; return; } if(d.indexOf('509')===0) d=d.slice(3); }   // « +509… » tapé quand même : on l'enlève
  else if(d.length>8&&d.indexOf('509')===0) d=d.slice(3); d=d.slice(0,8);
  var f=d.replace(/^(\d{2})(\d{0,2})(\d{0,2})(\d{0,2}).*$/,function(_,a,b,c,e){ return [a,b,c,e].filter(Boolean).join(' '); }); if(el.value!==f) el.value=f; }
document.querySelectorAll('.tel509 input').forEach(function(el){ el.addEventListener('input',function(){ telHaiti(el); }); telHaiti(el); });
