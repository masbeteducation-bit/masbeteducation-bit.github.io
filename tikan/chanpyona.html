<style>
:root{--navy:#14213d;--or:#fca311;--vert:#1d8a4e;--bg:#eef1f7;--carte:#fff;--fg:#14213d;--doux:#5d6782;--ligne:#dfe4ee;--titre:#1f3b8a;--alt:#f4f6fb;--q:#e3f4ea;--tir:#fff3cd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--carte:#141e33;--fg:#e6ecf7;--doux:#9aa7c2;--ligne:#26324d;--titre:#7fb2ff;--alt:#18233b;--q:#14362a;--tir:#3d3417}}

header{background:linear-gradient(135deg,#14213d 0%,#1c2f58 100%);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:2}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.top img{width:38px;height:38px;border-radius:9px;background:#fff}
.top .t{flex:1;min-width:0}.top .t small{display:block;color:#ffd77a;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top .t b{display:block;font-size:19px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:0 2px;max-width:720px;margin:10px auto 0}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:#c9d3ea;font:inherit;font-weight:700;font-size:13.5px;padding:7px 9px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--or)}
main{max-width:720px;margin:0 auto;padding:12px 16px 48px}
.carte{background:var(--carte);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
h2{font-size:16px;color:var(--titre);margin:0 0 8px}
.doux{color:var(--doux);font-size:13px}
.maj{color:var(--doux);font-size:12.5px;text-align:center;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--doux);font-weight:700;padding:5px 3px;text-align:center;border-bottom:1.5px solid var(--ligne)}
td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--ligne)}
td.e,th.e{text-align:left}
td.p{font-weight:800}
tr.q td{background:var(--q)}tr.q td:first-child{box-shadow:inset 4px 0 0 var(--vert)}
tr.tir td{background:var(--tir)}
.bdg{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 4px;margin-right:6px;vertical-align:1px}
.note{font-size:12.5px;color:var(--doux);margin-top:6px}
.jr{font-weight:800;color:var(--doux);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.jr:first-child{margin-top:0}
.m{border:1.5px solid var(--ligne);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.m .h{display:flex;justify-content:space-between;font-size:12px;color:var(--doux);margin-bottom:4px}
.m .l{display:flex;align-items:center;gap:6px;padding:2px 0}
.m .l .n{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .l .s{font-weight:800;font-size:17px;min-width:22px;text-align:right}
.m .l.g .n,.m .l.g .s{color:var(--vert)}
.m .b{font-size:12.5px;color:var(--doux);margin-top:4px;line-height:1.45}
.vs{display:flex;align-items:center;gap:8px}
.vs .x{flex:1;min-width:0;padding:8px;border-radius:10px;background:var(--alt);font-weight:700;font-size:14px}
.vs .x small{display:block;color:var(--doux);font-weight:600;font-size:11.5px}
.vs .c{font-weight:800;color:var(--doux);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--alt);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--titre);line-height:1.2}
.kpi span{font-size:12px;color:var(--doux)}
.rec{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--ligne);font-size:14px}
.rec:last-child{border-bottom:0}.rec span{color:var(--doux)}.rec b{text-align:right}
.vide{color:var(--doux);text-align:center;padding:18px 8px}
.liens{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;border-radius:12px;padding:11px;font-weight:800;font-size:14px;background:var(--or);color:var(--navy);text-align:center;text-decoration:none}
.btn.sec{background:var(--carte);color:var(--fg);border:1.5px solid var(--ligne)}
footer{text-align:center;color:var(--doux);font-size:12.5px;padding:8px 16px 30px}
.cache{display:none!important}
</style>

<script>
var CONTENU=window.MASBET_CONTENU||'', DEMO=!CONTENU, LANG='ht', C=null, VUE='klas', DT=0, DJ=null;   // DJ : dates enregistrées dans l'Admin
var TX={
 ht:{tabs:{klas:'📊 Klasman',res:'⚽ Rezilta',pro:'📅 Pwochen match',fin:'🏆 Faz final',sta:'📈 Estatistik'},charge:'Chajman…',erreur:'Pa ka chaje done yo. Tcheke koneksyon an epi eseye ankò.',reesse:'Eseye ankò',apre:'Klasman, rezilta ak estatistik yo ap parèt isit la apre tiraj la ak premye match yo.',
  pa:'Chanpyona a poko kòmanse : kalandriye a ap parèt isit la.',gr:'Gwoup',fanm:'Tounwa fanm',eq:'Ekip',maj:function(h){ return 'Mete ajou a '+h+' · chak minit'; },
  leg:'J jwe · G genyen · N nil · P pèdi · BP gòl bay · BK gòl pran · +/- diferans',q:'2 premye nan chak gwoup yo ale nan ka-de-final.',tir:'fòk gen tiraj osò',
  dep:{face:'fas-a-fas',kart:'mwens kat',atk:'atak, diferans, defans',dif:'diferans',def:'defans'},poko:'Poko gen match jwe.',pokoPro:'Pa gen lòt match pwograme.',
  ko:'Faz eliminasyon an poko kòmanse. Si klasman an rete konsa, men ka-de-final yo :',koSans:'Faz final la ap parèt isit la lè match yo pwograme.',si:'pwojeksyon : sa ka chanje',
  kf:'Ka-de-final',pr:'1e',dz:'2yèm',tab:'penal',kpi:['match jwe','gòl','gòl pa match'],but:'Meyè butè',jwe:'Jwè',gol:'Gòl',pen:'pen.',kont:'Gòl kont pwòp kan pa konte.',
  eqs:'Ekip yo',atk:'Pi bon atak',def:'Pi bon defans',fp:'Fair-play (mwens kat)',rek:'Rekò',gv:'Pi gwo viktwa',pg:'Match ki gen plis gòl',kat:'Kat',j:'jòn',r:'wouj',
  jou:['dimanch','lendi','madi','mèkredi','jedi','vandredi','samdi'],app:'⚽ Match yo sou Masbet',pwo:'📖 Pwotokòl la',direk:'AN DIRÈK',fini:'Fini',ranv:'Ranvwaye',vid:'—'},
 fr:{tabs:{klas:'📊 Classement',res:'⚽ Résultats',pro:'📅 Prochains matchs',fin:'🏆 Phase finale',sta:'📈 Statistiques'},charge:'Chargement…',erreur:'Impossible de charger les données. Vérifiez la connexion et réessayez.',reesse:'Réessayer',apre:'Classement, résultats et statistiques apparaîtront ici après le tirage et les premiers matchs.',
  pa:'Le championnat n\'a pas encore commencé : le calendrier apparaîtra ici.',gr:'Groupe',fanm:'Tournoi féminin',eq:'Équipe',maj:function(h){ return 'Mis à jour à '+h+' · chaque minute'; },
  leg:'J joués · G gagnés · N nuls · P perdus · BP buts pour · BC buts contre · +/- différence',q:'Les 2 premiers de chaque groupe vont en quarts de finale.',tir:'tirage au sort nécessaire',
  dep:{face:'face-à-face',kart:'moins de cartons',atk:'attaque, différence, défense',dif:'différence',def:'défense'},poko:'Aucun match joué pour l\'instant.',pokoPro:'Aucun autre match programmé.',
  ko:'La phase à élimination directe n\'a pas commencé. Si le classement reste ainsi, voici les quarts de finale :',koSans:'La phase finale apparaîtra ici quand les matchs seront programmés.',si:'projection : peut encore changer',
  kf:'Quarts de finale',pr:'1er',dz:'2e',tab:'tirs au but',kpi:['matchs joués','buts','buts par match'],but:'Meilleurs buteurs',jwe:'Joueur',gol:'Buts',pen:'pén.',kont:'Les buts contre son camp ne comptent pas.',
  eqs:'Les équipes',atk:'Meilleure attaque',def:'Meilleure défense',fp:'Fair-play (moins de cartons)',rek:'Records',gv:'Plus large victoire',pg:'Match le plus prolifique',kat:'Cartons',j:'jaunes',r:'rouges',
  jou:['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],app:'⚽ Les matchs sur Masbet',pwo:'📖 Le protocole',direk:'EN DIRECT',fini:'Terminé',ranv:'Reporté',vid:'—'}};
function T(k){ return TX[LANG][k]; }
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lire(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ecrire(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function bdg(n){ var e=(C.equipes||{})[n]||{}; return '<span class="bdg" style="background:'+(/^#[0-9a-f]{6}$/i.test(e.c||'')?e.c:'#14213d')+'">'+esc(e.s||String(n).slice(0,3).toUpperCase())+'</span>'; }
function jour(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function heure(iso){ var d=new Date(iso); return isNaN(d)?'':('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function jourTxt(j){ var d=new Date(j+'T12:00:00'); return T('jou')[d.getDay()]+' '+d.getDate()+'/'+('0'+(d.getMonth()+1)).slice(-2); }
function grNom(g){ return /^fi$/i.test(g)?T('fanm'):T('gr')+' '+g; }

function langue(l){ LANG=l==='fr'?'fr':'ht'; ecrire('masbet_lang',LANG); document.documentElement.lang=LANG; $('bLang').textContent=LANG==='ht'?'FR':'KR';
  $('lApp').textContent=T('app'); $('lPwo').textContent=T('pwo'); $('lPwo').href='/tikan/pwotokol'+(LANG==='fr'?'?lang=fr':''); if($('charge')) $('charge').textContent=T('charge'); afficher(); }
function onglet(v){ VUE=v; try{ history.replaceState(null,'','#'+v); }catch(e){} afficher(); window.scrollTo(0,0); }

function charger(){
  var p=DEMO?Promise.resolve(demo()):Promise.race([fetch(CONTENU+'?api=lokal&_='+Date.now(),{credentials:'omit',cache:'no-store',redirect:'follow'}).then(function(r){ return r.json(); }).then(function(j){ if(!j||!j.ok) throw new Error(''); return j.data; }),
    new Promise(function(_,ko){ setTimeout(function(){ ko(new Error('délai')); },25000); })]);
  p.then(function(d){
    var L=(d&&d.championnats)||[], q=/[?&]c=([A-Za-z0-9]+)/.exec(location.search);
    C=L.filter(function(x){ return q?x.id===q[1]:x.tk; })[0]||L.filter(function(x){ return /tikan/i.test(x.nom); })[0]||null;
    DT=Date.now(); afficher();
  }).catch(function(){ if(!C) $('zone').innerHTML='<div class="carte vide">'+esc(T('erreur'))+'<br><br><button class="btn" style="border:0;font:inherit;font-weight:800" onclick="charger()">'+esc(T('reesse'))+'</button></div>'; });
}

function ligneMatch(m){
  var fini=m.st==='FINI', dir=m.st==='DIREK', tab=fini&&m.td!=null&&m.te!=null&&m.bd===m.be;
  var gd=fini&&(m.bd>m.be||(tab&&m.td>m.te)), ge=fini&&(m.be>m.bd||(tab&&m.te>m.td));
  var l=function(n,s,g,t){ return '<div class="l'+(g?' g':'')+'">'+bdg(n)+'<span class="n">'+esc(n)+'</span>'+(fini||dir?'<span class="s">'+esc(s)+(tab?' <small>('+esc(t)+')</small>':'')+'</span>':'')+'</div>'; };
  var bl=function(c){ var g={},o=[]; ((m.b||{})[c]||[]).forEach(function(x){ var k=x.n+(x.t==='csc'?' (csc)':''); if(!g[k]){ g[k]=[]; o.push(k); } g[k].push((x.m!=null?x.m+'\'':'')+(x.t==='pen'?' '+T('pen'):'')); });
    var k=(m.k||[]).filter(function(x){ return x.c===c; }).map(function(x){ return (x.k==='R'?'🟥':x.k==='JJ'?'🟨🟨':'🟨')+' '+esc(x.n); });
    var t=o.map(function(n){ var mn=g[n].filter(Boolean); return esc(n)+(mn.length?' '+esc(mn.join(', ')):g[n].length>1?' ×'+g[n].length:''); });
    return t.length||k.length?'<div>'+bdg(c==='d'?m.d:m.e)+(t.length?'⚽ '+t.join(' · '):'')+(t.length&&k.length?' · ':'')+k.join(' · ')+'</div>':''; };
  var et=dir?'<b style="color:#d62828">● '+T('direk')+'</b>':fini?T('fini'):m.st==='RANVWAYE'?T('ranv'):heure(m.t);
  return '<div class="m"><div class="h"><span>'+esc(m.ko?m.phase:grNom((C.equipes[m.d]||{}).g||'')+(m.phase&&!/^faz gwoup$/i.test(m.phase)?' · '+m.phase:''))+'</span><span>'+et+'</span></div>'+
    l(m.d,m.bd,gd,m.td)+l(m.e,m.be,ge,m.te)+(fini||dir?'<div class="b">'+bl('d')+bl('e')+'</div>':'')+(m.lieu?'<div class="b">'+esc(m.lieu)+'</div>':'')+'</div>';
}
function parJour(l,desc){ var j={},o=[]; l.forEach(function(m){ var k=jour(m.t)||'?'; if(!j[k]){ j[k]=[]; o.push(k); } j[k].push(m); }); o.sort(); if(desc) o.reverse();
  return o.map(function(k){ return '<div class="jr">'+(k==='?'?'—':esc(jourTxt(k)))+'</div>'+j[k].sort(function(a,b){ return String(a.t).localeCompare(String(b.t)); }).map(ligneMatch).join(''); }).join(''); }
function notes(g){ var n=[], L=g.lignes;
  for(var i=0;i<L.length;i++){ var j=i; while(j+1<L.length&&L[j+1].pts===L[i].pts) j++;
    if(j>i&&L[i].dep&&L[i].j){ var b=L.slice(i,j+1), tir=b.filter(function(x){ return x.tir; });
      n.push(tir.length?tir.map(function(x){ return x.eq; }).join(', ')+' : '+T('tir'):b.map(function(x){ return x.eq; }).join(' > ')+' ('+(T('dep')[b[0].dep]||'')+')'); }
    i=j; } return n; }
function grpMasc(){ return (C.klasman||[]).filter(function(g){ return g.lignes.length&&!/^fi$/i.test(g.groupe); }); }

function vKlas(){
  var K=(C.klasman||[]).filter(function(g){ return g.lignes.length; }), quatre=grpMasc().length===4;
  if(!K.length) return '<div class="carte vide">'+esc(T('pa'))+'</div>';
  return K.map(function(g){ var nt=notes(g), q=quatre&&!/^fi$/i.test(g.groupe);
    return '<div class="carte"><h2>'+esc(g.groupe?grNom(g.groupe):T('eq'))+'</h2><table><tr><th>#</th><th class="e">'+T('eq')+'</th><th>J</th><th>G</th><th>N</th><th>P</th><th>+/-</th><th>Pts</th></tr>'+
      g.lignes.map(function(x,i){ return '<tr class="'+(x.tir?'tir':q&&i<2?'q':'')+'"><td>'+(i+1)+'</td><td class="e">'+bdg(x.eq)+esc(x.eq)+(x.tir?' *':'')+'</td><td>'+x.j+'</td><td>'+x.g+'</td><td>'+x.n+'</td><td>'+x.p+'</td><td>'+(x.df>0?'+':'')+x.df+'</td><td class="p">'+x.pts+'</td></tr>'; }).join('')+'</table>'+
      (nt.length?'<div class="note">'+nt.map(esc).join('<br>')+'</div>':'')+'</div>'; }).join('')+
    '<div class="note" style="text-align:center">'+esc(T('leg'))+(quatre?'<br>▌ '+esc(T('q')):'')+'</div>';
}
function vRes(){ var l=(C.matchs||[]).filter(function(m){ return m.st==='FINI'||m.st==='DIREK'; });
  return l.length?'<div class="carte">'+parJour(l,true)+'</div>':'<div class="carte vide">'+esc(T('poko'))+'</div>'; }
function vPro(){ var l=(C.matchs||[]).filter(function(m){ return m.st==='PWOGRAME'||m.st==='RANVWAYE'; });
  return l.length?'<div class="carte">'+parJour(l,false)+'</div>':'<div class="carte vide">'+esc(T('pokoPro'))+'</div>'; }
function vFin(){
  var ko=(C.matchs||[]).filter(function(m){ return m.ko; });
  if(ko.length){ var rang=function(x){ x=String(x).toLowerCase(); return /8e|huiti/.test(x)?1:/quart|ka-de/.test(x)?2:/demi/.test(x)?3:/3e|troisi/.test(x)?4:/final/.test(x)?5:0; };
    var ph=[]; ko.forEach(function(m){ if(ph.indexOf(m.phase)<0) ph.push(m.phase); }); ph.sort(function(a,b){ return rang(a)-rang(b); });
    return ph.map(function(p){ return '<div class="carte"><h2>'+(rang(p)===5?'🏆 ':'')+esc(p)+'</h2>'+ko.filter(function(m){ return m.phase===p; }).sort(function(a,b){ return String(a.t).localeCompare(String(b.t)); }).map(ligneMatch).join('')+'</div>'; }).join(''); }
  var G=grpMasc(); if(G.length!==4||!G.some(function(g){ return g.lignes.some(function(x){ return x.j; }); })) return '<div class="carte vide">'+esc(T('koSans'))+'</div>';
  var by={}; G.forEach(function(g){ by[String(g.groupe).toUpperCase()]=g.lignes; });
  var pos=function(gr,i){ var l=by[gr]||[]; return '<div class="x"><small>'+(i?T('dz'):T('pr'))+' '+esc(gr)+'</small>'+(l[i]?bdg(l[i].eq)+esc(l[i].eq):'?')+'</div>'; };
  return '<div class="carte"><h2>'+esc(T('kf'))+'</h2><div class="doux" style="margin-bottom:8px">'+esc(T('ko'))+'</div>'+
    [['A','B'],['B','A'],['C','D'],['D','C']].map(function(p){ return '<div class="vs" style="margin-bottom:8px">'+pos(p[0],0)+'<span class="c">–</span>'+pos(p[1],1)+'</div>'; }).join('')+
    '<div class="note">* '+esc(T('si'))+'</div></div>';
}
function vSta(){
  var F=(C.matchs||[]).filter(function(m){ return m.st==='FINI'&&m.bd!=null&&m.be!=null; });
  if(!F.length) return '<div class="carte vide">'+esc(T('poko'))+'</div>';
  var buts=F.reduce(function(s,m){ return s+m.bd+m.be; },0), E={};
  var eq=function(n){ return E[n]=E[n]||{n:n,j:0,bp:0,bc:0,kj:0,kr:0}; };
  F.forEach(function(m){ var a=eq(m.d), b=eq(m.e); a.j++; b.j++; a.bp+=m.bd; a.bc+=m.be; b.bp+=m.be; b.bc+=m.bd;
    (m.k||[]).forEach(function(x){ var t=eq(x.c==='d'?m.d:m.e); if(x.k==='J') t.kj++; else if(x.k==='JJ') t.kj+=2; else t.kr++; }); });
  var L=Object.keys(E).map(function(k){ return E[k]; });
  var kj=L.reduce(function(s,x){ return s+x.kj; },0), kr=L.reduce(function(s,x){ return s+x.kr; },0);
  var top=function(f,asc){ var l=L.slice().sort(function(a,b){ return asc?f(a)-f(b):f(b)-f(a); }); return l.filter(function(x){ return f(x)===f(l[0]); }); };
  var moy=function(v,j){ return (j?v/j:0).toFixed(1).replace('.',LANG==='fr'?',':'.'); };
