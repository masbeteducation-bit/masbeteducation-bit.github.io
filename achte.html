<title>MasbetAirNet — Achte kòd Wi-Fi</title>
<style>
  :root{--navy:#14213d;--blue:#173a8c;--gold:#fca311;--bg:#f4f5f8;--card:#fff;--ink:#14213d;--muted:#5d6782;--line:#e2e5ee;--ok:#1d8a4e;--err:#c0392b;--wait:#b76e00}
  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:contain}
  .navapp{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .navapp a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:700}
  .navapp a span{display:block;font-size:20px;line-height:1.2}
  .navapp a.on{color:var(--navy)}
  body.app main{padding-bottom:90px}
  @media (min-width: 900px){
    body.app .navapp{position:sticky;top:0;bottom:auto;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0}
    body.app .navapp a{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:15px;border-bottom:3px solid transparent}
    body.app .navapp a span{display:inline;font-size:18px}
    body.app .navapp a.on{border-bottom-color:var(--gold)}
    body.app main{padding-bottom:40px}
  }
  .retour{display:block;background:var(--navy);color:var(--gold);font-weight:800;font-size:15px;padding:13px 16px;text-decoration:none}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .top{background:#fff;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top img{display:block;width:100%;max-width:230px;height:auto;min-width:0;flex:0 1 auto}
  .lang{display:flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;flex-shrink:0}
  .lang button{border:0;background:#fff;color:var(--muted);font-weight:800;font-size:13px;padding:6px 10px}
  .lang button.on{background:var(--navy);color:#fff}
  header{background:var(--navy);color:#fff;padding:12px 16px 22px}
  header .brand{font-weight:800;font-size:20px;letter-spacing:.3px}
  header .brand span{color:var(--gold)}
  header p{margin:2px 0 0;color:#c9d0e3;font-size:14px}
  main{max-width:520px;margin:-10px auto 0;padding:0 16px 40px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;border:0;border-radius:10px;padding:11px;background:#fff;color:var(--muted);font-weight:700;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .tab.on{background:var(--gold);color:var(--navy)}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
  h2{font-size:17px;margin:0 0 12px}
  .step{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;align-items:center;justify-content:center;margin-right:8px}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .plan{border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left;color:var(--ink);font:inherit}
  .plan .p{font-size:22px;font-weight:800}
  .plan .p small{font-size:13px;font-weight:600;color:var(--muted)}
  .plan .d{font-size:14px;color:var(--muted)}
  .plan.on{border-color:var(--gold);background:#fff8ea}
  .plan:disabled{opacity:.45}
  .methods{display:flex;gap:10px}
  .method{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;font:inherit;font-weight:800;color:var(--ink)}
  .method.on{border-color:var(--gold);background:#fff8ea}
  /* Masbet Pay : couleurs des opérateurs (MonCash rouge et blanc, NatCash orange et bleu foncé) */
  #mMonCash{border-color:#e3001b;color:#e3001b;background:#fff}
  #mMonCash.on{background:#e3001b;color:#fff;border-color:#e3001b;box-shadow:0 0 0 3px #ffd1d6}
  #mNatCash{border-color:#f07d00;color:#0b2f6b;background:#fff}
  #mNatCash.on{background:#f07d00;color:#0b2f6b;border-color:#0b2f6b;box-shadow:0 0 0 3px #ffe2bf}
  .pay.moncash{background:#e3001b!important;color:#fff!important}
  .pay.natcash{background:#0b2f6b!important;color:#fff!important;border-top:5px solid #f07d00}
  .pay.moncash b,.pay.moncash .num{color:#fff}
  .prods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
  @media (min-width:640px){.prods{grid-template-columns:repeat(4,1fr)}}
  .prod{border:2px solid var(--line);border-radius:12px;padding:9px 8px;background:#fff;font:inherit;font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap}
  .prod.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .pay{background:var(--navy);color:#fff;border-radius:12px;padding:14px;margin-top:12px;font-size:15px}
  .pay b{color:var(--gold)}
  .pay .num{font-size:24px;font-weight:800;letter-spacing:1px;color:#fff}
  .pay .sub{margin-top:8px;color:#c9d0e3;font-size:13px}
  label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
  input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--gold)}
  .telgrp{display:flex}
  select.pref{-webkit-appearance:none;appearance:none;cursor:pointer;font-family:inherit}
  .telgrp .pref{display:flex;align-items:center;padding:0 12px;background:#eef0f6;border:1.5px solid var(--line);border-right:0;border-radius:10px 0 0 10px;font-weight:800;font-size:17px;color:var(--navy);white-space:nowrap}
  .telgrp input{border-radius:0 10px 10px 0;min-width:0}
  .telgrp:focus-within .pref{border-color:var(--gold)}
  .hint{font-size:13px;color:var(--muted);margin-top:4px}
  .btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:800;font-size:17px}
  .btn:disabled{opacity:.5}
  .msg{padding:12px;border-radius:10px;margin-top:12px;font-size:15px}
  .msg.err{background:#fdecea;color:var(--err)}
  .msg.ok{background:#e8f6ee;color:var(--ok)}
  .order{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .order .top2{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
  .badge{font-weight:800;font-size:13px;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .b-wait{background:#fff3df;color:var(--wait)}.b-ok{background:#e8f6ee;color:var(--ok)}.b-err{background:#fdecea;color:var(--err)}
  .code{margin-top:10px;background:var(--navy);color:var(--gold);font-size:28px;font-weight:800;letter-spacing:3px;text-align:center;padding:12px;border-radius:10px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;-webkit-user-select:all;user-select:all}
  .copy{margin-top:6px;width:100%;padding:9px;border:0;border-radius:8px;background:#eef0f6;color:var(--navy);font-weight:700;font-size:14px}
  .unlock{display:flex;gap:8px;margin-top:8px}
  .unlock input{flex:1;min-width:0;font-size:15px;padding:10px}
  .unlock button{border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;padding:0 14px;font-size:14px;white-space:nowrap}
  .hidden{display:none}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
  .demo{background:#fff3df;color:var(--wait);text-align:center;font-size:13px;padding:6px}
.tip{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin:6px 0 4px}.tip-wifi{background:#e8f0fe;color:#173a8c}.tip-rek{background:#fff4dc;color:#8a5a00}.tip-live{background:#fdecea;color:#a3221b}.tip-pass{background:#e8f6ee;color:#1d6b3a}.tip-suite{background:#efe9fb;color:#4b2a8f}
</style>
</head>

function paysDe(el){ var s=document.getElementById(el.id==='tel2'?'pays2':'pays'); return s?s.value:'509'; }
function nettoyerTel(el){
  var p=paysDe(el);
  if(p==='509'){
    var d = el.value.replace(/\D/g,'');
    if (d.length > 8 && d.indexOf('509') === 0) d = d.substring(3);
    d = d.substring(0, 8);
    var f = d.replace(/^(\d{2})(\d{0,2})(\d{0,2})(\d{0,2}).*$/, function(_,a,b,c,e){ return [a,b,c,e].filter(Boolean).join(' '); });
    if (el.value !== f) el.value = f;
  } else if(p==='x'){
    var v=el.value.replace(/[^\d+ ]/g,''); if(v && v.charAt(0)!=='+') v='+'+v.replace(/\+/g,''); if(el.value!==v) el.value=v;
  } else {
    var g=el.value.replace(/[^\d ]/g,'').substring(0,18); if(el.value!==g) el.value=g;
  }
}

  if(!presents[PRODUIT]) PRODUIT='wifi';
  var noms={wifi:'prodWifi',live:'prodLive',pro:'prodPro',suite:'prodSuite'}, aides={wifi:'aideWifi',live:'aideLive',pro:'aidePro',suite:'aideSuite'};
  document.getElementById('prods').innerHTML=['wifi','live','pro','suite'].filter(function(p){ return presents[p]; }).map(function(p){
    return '<button class="prod'+(p===PRODUIT?' on':'')+'" role="tab" aria-selected="'+(p===PRODUIT)+'" onclick="choisirProduit(\''+p+'\')">'+T(noms[p])+'</button>'; }).join('');
  document.getElementById('prods').classList.toggle('hidden', Object.keys(presents).length<2);
  document.getElementById('prodAide').textContent=T(aides[PRODUIT]);
  INFOS.forfaits.forEach(function(f,k){
    if(produitDe(f)!==PRODUIT) return;
    var on=(FORFAIT&&FORFAIT.nom===f.nom?' on':''), dis=(f.disponible?'':'disabled');
    if(f.type==='LIVE'){
      if(!f.disponible) return;   // épuisé ou pas encore en vente : on ne l'affiche pas
      h+='<button class="plan'+on+'" id="p'+k+'" onclick="choisirForfait('+k+')">'+
        '<div class="p">'+esc(f.prix)+' <small>HTG</small></div><div class="d"><b>'+esc(f.nom)+'</b></div><div class="d">'+T(PRODUIT==='pro'?'prodPro':PRODUIT==='suite'?'prodSuite':'tike')+'</div></button>';
      return;
    }
    h+='<button class="plan'+on+'" '+dis+' id="p'+k+'" onclick="choisirForfait('+k+')">'+
       '<div class="p">'+esc(f.prix)+' <small>HTG</small></div><div class="d">'+esc(f.volume)+' · '+esc(f.duree)+' '+T('jours')+'</div>'+
       (f.disponible?'':'<div class="d"><b>'+T('epuise')+'</b></div>')+'</button>';
  });
  document.getElementById('plans').innerHTML=h||'<div class="hint">'+T('aucunForfait')+'</div>';
  document.getElementById('tikes').classList.add('hidden');
  if(PRODUIT!=='wifi' && !window.TIKES_VU){ window.TIKES_VU=true; setTimeout(function(){ document.getElementById('prods').scrollIntoView({behavior:'smooth',block:'start'}); },150); }
}
function afficherPied(){ var w=INFOS&&INFOS.whatsapp; document.getElementById('foot').innerHTML=(w?T('aide')+'<b>'+esc(w)+'</b>':'')+'<div style="margin-top:6px;font-size:12.5px;opacity:.75">Masbet Education · '+esc(T('fondate'))+'Duckhens Lespérance</div>'; }

function choisirForfait(k){
  FORFAIT=INFOS.forfaits[k];
  document.querySelectorAll('.plan').forEach(function(b){b.classList.remove('on');});
  document.getElementById('p'+k).classList.add('on');
  majPaiement();
}

// ---------- Étape 2 : paiement ----------
function choisirMethode(m){
  METHODE=m;
  document.getElementById('mMonCash').classList.toggle('on',m==='MonCash');
  document.getElementById('mNatCash').classList.toggle('on',m==='NatCash');
  majPaiement();
}
function majPaiement(){
  var box=document.getElementById('payBox');
  if(!METHODE || !INFOS){ box.classList.add('hidden'); return; }
  var c = METHODE==='MonCash' ? INFOS.moncash : INFOS.natcash;
  box.innerHTML = TXT[LANG].payer(METHODE, FORFAIT ? esc(FORFAIT.prix)+' HTG' : T('montantForfait'))+
    '<div class="num">'+esc(c.numero||'—')+'</div>'+(c.nom?T('nom')+esc(c.nom):'')+
    '<div class="sub">'+TXT[LANG].garderSms(METHODE==='MonCash'?'« Txn ID »':'« TransCode »')+'</div>'+
    (PORTAIL?'':'<div class="sub" style="margin-top:10px;border-top:1px solid rgba(255,255,255,.2);padding-top:8px">'+T('diaspora')+'</div>');
  box.classList.remove('moncash','natcash'); box.classList.add(METHODE==='MonCash'?'moncash':'natcash');
  box.classList.remove('hidden');
}

// ---------- Étape 3 : commande ----------
function envoyer(){
  msg('msg',''); DERNIER=null;
  if(!FORFAIT) return msg('msg',T('choisirForfait'),'err');
  if(!METHODE) return msg('msg',T('choisirMethode'),'err');
  var tel=telComplet('tel'), tx=document.getElementById('tx').value;
  var b=document.getElementById('go'); b.disabled=true; b.textContent=T('envoi');
  appel('passerCommande',{forfait:FORFAIT.nom,methode:METHODE,telephone:tel,transaction:tx,live:true}).then(function(r){
    ecrire('masbet_tel',document.getElementById('tel').value); ajouterIds([r.id]);
    document.getElementById('tx').value='';
    document.getElementById('tel2').value=document.getElementById('tel').value;
    DERNIER=r; afficherResultat(r);
    if(r.statut!=='Validée') setTimeout(function(){ vue('mine'); },1500);
  }).catch(function(e){ msg('msg',esc(erreur(e)),'err'); })
    .then(function(){ b.disabled=false; b.textContent=T('envoyer'); });
}
function afficherResultat(r){
  if(r.statut==='Validée' && r.type==='LIVE'){
    msg('msg',TXT[LANG].payeOk(esc(r.montant))+T('votreTike')+'<div class="code">'+esc(r.code)+'</div>'+boutonLive(r.code,r.forfait)+'<div class="hint">'+T(usageCode(r.forfait))+'</div>','ok');
  } else if(r.statut==='Validée'){
    msg('msg',TXT[LANG].payeOk(esc(r.montant))+(r.ajuste?TXT[LANG].ajuste(esc(r.forfait),esc(r.volume),esc(r.duree)):T('votreCode'))+
      '<div class="code">'+esc(r.code)+'</div>'+boutonKonekte(r.code)+(PORTAIL?'':TXT[LANG].entrerSur(esc(INFOS.ssid))),'ok');
  } else {
    msg('msg',TXT[LANG].recue(esc(r.id)),'ok');
  }
}

// ---------- Mes codes ----------
function badge(s){ return s==='Validée'?'<span class="badge b-ok">'+T('valide')+'</span>':s==='Refusée'?'<span class="badge b-err">'+T('refuse')+'</span>':'<span class="badge b-wait">'+T('attente')+'</span>'; }

function chercher(silencieux, tx){
  var tel=telComplet('tel2');
  if(!silencieux) msg('msg2','');
  appel('mesCommandes',tel,{ids:mesIds(), tx:tx||'', live:true}).then(function(res){
    ecrire('masbet_tel',document.getElementById('tel2').value);
    var l=res.commandes||[];
    if(tx){
      if(res.txTrouve){ ajouterIds(res.idsTx||[]); }
      else msg('msg2',T('txInconnu'),'err');
    }
    LISTE=l; afficherListe(l);
    clearTimeout(POLL);
    var attente=l.some(function(c){ return c.statut==='En attente'; });
    if(attente) POLL=setTimeout(function(){ chercher(true); }, DEMO?4000:20000);
  }).catch(function(e){ if(!silencieux) msg('msg2',esc(erreur(e)),'err'); });
}
function debloquer(id){
  var v=document.getElementById('u-'+id).value.trim();
  if(!v) return;
  chercher(false, v);
}
function afficherListe(l){
  var ssid = esc(INFOS && INFOS.ssid || 'Masbet.AirNet');
  var h='';
  l.forEach(function(c){
    h+='<div class="order"><div class="top2"><span>'+esc(c.id)+' · '+esc(c.date||T('maintenant'))+'</span>'+badge(c.statut)+'</div>'+
       '<div class="tip tip-'+typeCode(c).toLowerCase()+'">'+T('tip'+typeCode(c))+'</div>'+
       '<div><b>'+esc(c.forfait)+'</b>'+(c.volume?' — '+esc(c.volume)+', '+esc(c.duree)+' '+T('jours'):'')+'</div>'+
       (c.code && c.masque && c.type==='RECOMPENSE' ? '<div class="code" style="opacity:.55">'+esc(c.code)+'</div><div class="hint">'+T('masqueRek')+'</div>' : '')+
       (c.code && c.masque && c.type!=='RECOMPENSE' ? '<div class="code" style="opacity:.55">'+esc(c.code)+'</div>'+
         '<div class="hint">'+T('masqueAide')+'</div>'+
         '<div class="unlock"><input id="u-'+esc(c.id)+'" type="text" inputmode="numeric" placeholder="'+esc(T('txPlaceholder'))+'"><button onclick="debloquer(\''+jsid(c.id)+'\')">'+T('voirCode')+'</button></div>' : '')+
       (c.code && !c.masque && c.type==='LIVE' ?'<div class="code">'+esc(c.code)+'</div>'+boutonLive(c.code,c.forfait)+'<button class="copy" onclick="copier(\''+jsid(c.code)+'\',this)">'+T('copier')+'</button><div class="hint">'+T(usageCode(c.forfait))+'</div>':'')+
       (c.code && !c.masque && c.type!=='LIVE' ?'<div class="code">'+esc(c.code)+'</div>'+boutonKonekte(c.code)+'<button class="copy" onclick="copier(\''+jsid(c.code)+'\',this)">'+T('copier')+'</button>'+
         '<div class="hint">'+T(c.type==='RECOMPENSE'?'remRek':'remWifi')+'</div><div class="hint">'+TXT[LANG].connecter(ssid)+'</div>':'')+
       (c.statut==='En attente'?'<div class="hint">'+T('verif')+'</div>':'')+
       (c.note?'<div class="hint">'+T('motif')+esc(c.note)+'</div>':'')+'</div>';
  });
  document.getElementById('list').innerHTML = h || '<div class="hint" style="margin-top:10px">'+T('aucune')+'</div>';
}

// ---------- Dans le portail GDMS : renvoyer le code à la page de connexion ----------
function boutonKonekte(code){
  if(!PORTAIL) return '';
  return '<button class="btn" style="margin-top:10px" onclick="konekte(\''+jsid(code)+'\')">'+T('konekte')+'</button><div class="hint">'+T('konekteAide')+'</div>';
}
// Adresse de la page de connexion (passée après « # », jamais envoyée au serveur)
function adresseRetour(){
  var m=/[#&]r=([^&]*)/.exec(location.hash||''), u='';
  try{ u=m?decodeURIComponent(m[1]):''; }catch(e){ u=''; }
  return (u && u.indexOf(location.origin+'/')===0) ? u : '';   // uniquement le portail lui-même
}
function retourner(code){
  var u=adresseRetour();
  var suffixe = code ? '#masbetcode='+encodeURIComponent(code) : '';
  if(u) location.href = u.split('#')[0] + suffixe;
  else if(code) location.href = 'paiement.html' + suffixe;
  else history.back();
}
function konekte(code){ retourner(String(code)); }
// Ticket live : dans l'application, bouton qui ouvre l'onglet Live avec le code déjà rempli
function typeCode(c){ return c.type==='LIVE' ? (estPass(c.forfait)?'Pass':estSuite(c.forfait)?'Suite':'Live') : (c.type==='RECOMPENSE'?'Rek':'Wifi'); }
function estSuite(nom){ return /^masbet\s*suite/i.test(String(nom||'')); }
function usageCode(nom){ return estPass(nom)?'passUsage':estSuite(nom)?'suiteUsage':'tikeUsage'; }
function estPass(nom){ return /^pass\s*pro/i.test(String(nom||'')); }
function boutonLive(code, nom){
  if(!window.MASBET_APP && !estSuite(nom)) return '';
  if(estPass(nom)) return '<a class="btn" style="margin-top:10px;text-decoration:none;text-align:center" href="index.html#quiz&pro&pass='+encodeURIComponent(code)+'">'+T('ouvrirPass')+'</a>';
  if(estSuite(nom)) return '<a class="btn" style="margin-top:10px;text-decoration:none;text-align:center" href="suite.html#kod='+encodeURIComponent(code)+'">'+T('ouvrirSuite')+'</a>';
  return '<a class="btn" style="margin-top:10px;text-decoration:none;text-align:center" href="index.html#videyo&tike='+encodeURIComponent(code)+'">'+T('ouvrirLive')+'</a>';
}
if(PORTAIL){
  ['pays','pays2'].forEach(function(id){ var s=document.getElementById(id); if(s){ s.selectedIndex=0; s.disabled=true; s.title='+509'; } });
  var barre=document.createElement('a'); barre.href='#'; barre.className='retour'; barre.textContent='← Retounen pou konekte';
  barre.onclick=function(){ retourner(''); return false; };
  document.body.insertBefore(barre, document.body.firstChild);
}

function copier(code,btn){
  var reussi=function(){ btn.textContent=T('copie'); setTimeout(function(){btn.textContent=T('copier');},1500); };
  var secours=function(){
    // Méthode ancienne, acceptée par plus de téléphones
    var ok=false;
    try{ var ta=document.createElement('textarea'); ta.value=code; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
         document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99); ok=document.execCommand('copy'); document.body.removeChild(ta); }catch(e){ ok=false; }
    if(ok) reussi(); else btn.textContent=T('copieEchec');
  };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(code).then(reussi, secours); } else secours(); }catch(e){ secours(); }
}

// ---------- Dans l'application MasbetAirNet : barre du bas ----------
var APPLI = !!window.MASBET_APP;
function barreAppli(){
  if(!APPLI) return;
  document.body.classList.add('app');
  var n=document.createElement('nav'); n.className='navapp'; n.id='navapp';
  if(window.innerWidth>=900) document.body.insertBefore(n, document.querySelector('main')); else document.body.appendChild(n);
  majBarreAppli();
}
function majBarreAppli(){
  var n=document.getElementById('navapp'); if(!n) return;
  var mine=!document.getElementById('vMine').classList.contains('hidden');
  var L=LANG==='fr'?['Accueil','Acheter','Matchs','Live','Mes codes']:['Akèy','Achte','Match','Live','Kòd mwen'];
  n.innerHTML='<a href="index.html#akey"><span>🏠</span>'+L[0]+'</a>'+
    '<a href="#" onclick="vue(\'buy\');return false" class="'+(mine?'':'on')+'"><span>📶</span>'+L[1]+'</a>'+
    '<a href="index.html#match"><span>⚽</span>'+L[2]+'</a>'+
    '<a href="index.html#videyo"><span>🔴</span>'+L[3]+'</a>'+
    '<a href="#" onclick="vue(\'mine\');return false" class="'+(mine?'on':'')+'"><span>🔑</span>'+L[4]+'</a>'+
    (window.innerWidth>=900?'<a href="apropo.html"><span>ℹ️</span>'+(LANG==='fr'?'À propos':'Konsènan nou')+'</a>':'');
}

// ---------- Démarrage ----------
if(DEMO) document.getElementById('demoBar').classList.remove('hidden');
var ip=Number(lire('masbet_pays')); if(!PORTAIL && ip>0){ ['pays','pays2'].forEach(function(id){ var s=document.getElementById(id); if(ip<s.options.length) s.selectedIndex=ip; }); changerPays(document.getElementById('pays')); }
var t=lire('masbet_tel'); if(t){ ['tel','tel2'].forEach(function(id){ var el=document.getElementById(id); el.value=t; nettoyerTel(el); }); }
barreAppli();
langue(lire('masbet_lang') || 'ht');
charger();
if(APPLI && /mine/.test(location.hash)) vue('mine');
</script>
